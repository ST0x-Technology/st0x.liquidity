# Observation-mode rollout fragment, not a deployable runtime config.
# Apply only after a supporting binary release and scope verification.
[pricing.trading_schedule]
mode = "observe"
environment = "staging"
poll_interval_secs = 5
request_timeout_secs = 3
response_freshness_secs = 30
calendar_max_age_secs = 7200
evidence_clock_skew_secs = 2
emergency_buffer_secs = 900

