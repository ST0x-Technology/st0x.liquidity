# DEAD ON GCP: this baked copy is NOT what the staging VM runs. The live
# config is t0.devops terraform/staging-liquidity/st0x-hedge.toml, delivered
# as a pinned Secret Manager version and mounted at /run/t0-config; editing
# this file changes nothing on the VM. It is deleted entirely once
# production's VM is replaced.

# STAGING config for the GCP VM (t0.devops terraform/staging-liquidity).
# Derived from config/staging/st0x-hedge.toml with exactly two deltas, kept
# as a SEPARATE file because the DigitalOcean droplet still deploys the
# original: adding kms_api_key there would trip the both-credentials refusal
# against the droplet's agenix api_private_key and break its next deploy.
#   1. [wallet] kms_api_key  -- keyless Turnkey auth (no [wallet] secrets)
#   2. no [telemetry]        -- OTLP endpoints pointed at the legacy tailnet,
#                               unreachable from GCP; stdout -> Cloud Logging
# Retire config/staging/st0x-hedge.toml (and fold this back to a single
# file) when the droplet is decommissioned.
# HTTP API port for the dashboard and health checks.
server_port = 8001
# HTTP port for the apalis-board job queue UI.
board_port = 8002

# Minimum log level: trace, debug, info, warn, error.
#
# NOT trace. On 2026-08-30 trace filled the production bot's 10 GB data disk
# with its own logs and SQLite began failing every write with SQLITE_FULL:
# order-fill polling stopped, no hedge fills for 20 hours, every telemetry
# collector went stale, and the process stayed up throughout so nothing
# paged. Same failure as 2026-06-08, which is why LOG_RETENTION_DAYS keeps
# seven daily files; that bound is on FILE COUNT, and at 2-2.9 GB a file
# seven of them could never fit on the disk.
#
# Measured on the 2026-08-29 production file: TRACE was 99.0% of the bytes,
# DEBUG 0.9%, INFO 0.1%. debug therefore cuts volume ~100x while keeping
# every line anything reads: the metrics exporter ships ERROR/WARN/INFO,
# /performance/reliability counts ERROR/WARN, and the SPA log viewer still
# shows debug. This one level also drives the console layer and both OTel
# exporters, so trace was being paid for in Cloud Logging ingest too.
log_level = "debug"
# Directory for rotated log files (stdout if omitted).
log_dir = "/mnt/data/logs"
# SQLite database path for event store, projections, and job queue.
database_url = "sqlite:///mnt/data/st0x-hedge.db"
# How often (seconds) Apalis purges finished background jobs.
apalis_finished_job_cleanup_interval_secs = 3600
# Consecutive offchain polls that must diverge from the inventory view's
# Hedging balance for a symbol before the poller escalates a forced snapshot
# reconciliation.
inventory_divergence_threshold = 10
hedge_order_gate_reconciliation_timeout_secs = 10

# IAP audiences for the role-gated ops API, from the `ops_api_audiences`
# output of terraform/staging-liquidity (applied 2026-08-27). The bot pins
# the audience per path prefix, so a token IAP minted for the read backend
# is refused on the write path even though its signature is valid.
#
# Not secrets: an audience names an IAM-gated backend and is useless without
# an identity Google will sign for. Removing this section unmounts the
# role-gated routes entirely. This table header ends the file's top-level
# key scope, so it must stay BELOW every bare key above.
[ops_api]
read_audience = "/projects/819265953297/global/backendServices/6620592880358364228"
write_audience = "/projects/819265953297/global/backendServices/6816788502563099716"

[pricing]
# The pricing plane on Cloud Run for THIS environment. Auth is the VM's
# ambient Google identity (run.invoker on the service, granted in
# t0.devops' pricing stack) — an ID token minted per connect, no
# [pricing] secret exists. The droplet's ws://st0x-pricing:8080 was a
# droplet-local container; it never existed on this VM.
ws_url = "wss://st0x-pricing-3z4ofantqq-ey.a.run.app/ws"
gcp_id_token = true
# Broker identity (type, mode, account_id, and for the keyless variant
# client_id and kms_key_version) now belongs in this section: it is names and
