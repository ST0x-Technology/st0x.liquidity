# st0x liquidity bot runtime config for STAGING: the deployed source of truth
# since 2026-09-07 (moved here from t0.devops terraform/staging-
# liquidity/st0x-hedge.toml; the stack there keeps only the secret and its
# grants). Every merge to the default branch validates it with the validate-
# config just built, publishes it as a version of the liquidity-runtime-config
# secret and pins that version into the new revision (build-oci.yml ->
# ST0x-Technology/.github app-release). No approval: staging is the fast path.
# Non-secret settings only; secrets come from Secret Manager env injection.
#
# STAGING config for the GCP VM (t0.devops terraform/staging-liquidity holds
# the VM; this file is what it runs). The image and this file now roll
# TOGETHER on every master merge, so the format-ahead-of-image gap the old
# split had is closed; the VM still fetches exactly the CONFIG_VERSION that
# images.env names, never `latest`.
# [wallet] kms_api_key is keyless Turnkey auth (no [wallet] secrets); there
# is no [telemetry] section (stdout -> Cloud Logging).
#
# HTTP API port for the dashboard and health checks.
server_port = 8001
# HTTP port for the apalis-board job queue UI.
board_port = 8002
# Minimum stdout log level. Docker's gcplogs driver exports TRACE to GCP.
log_level = "trace"
# gcplogs forwards each record as a serialized JSON line; Cloud Logging field
# parsing depends on the ingestion configuration.
log_format = "json"
# Directory and minimum level for local rotated log files. INFO reduces
# within-day volume on the 10 GB SQLite disk; seven-file retention caps file
# count, not bytes, so it is not a hard disk-usage bound.
log_dir = "/mnt/data/logs"
file_log_level = "info"
# SQLite database path for event store, projections, and job queue.
database_url = "sqlite:///mnt/data/st0x-hedge.db"
# How often (seconds) Apalis purges finished background jobs.
apalis_finished_job_cleanup_interval_secs = 3600
# Consecutive offchain polls that must diverge from the inventory view's
# Hedging balance for a symbol before the poller escalates a forced snapshot
# reconciliation.
inventory_divergence_threshold = 10
# Durable-read deadline (seconds) for reconciling open hedge order gates by
# order ID at startup (st0x.liquidity#1316). Required since that merge; its
# absence crash-looped the staging bot from 10:24 UTC on 2026-09-01.
hedge_order_gate_reconciliation_timeout_secs = 10

[pricing]
# The pricing plane on Cloud Run for THIS environment. Auth is the VM's
# ambient Google identity (run.invoker on the service, granted in
# t0.devops' pricing stack) : an ID token minted per connect, no
# [pricing] secret exists. The droplet's ws://st0x-pricing:8080 was a
# droplet-local container; it never existed on this VM.
ws_url = "wss://t0-pricing-616358167422.europe-west3.run.app/ws"
gcp_id_token = true
# Slippage tolerance (basis points) for counter-trades that hedge
# incoming orderbook fills.
[broker]
counter_trade_slippage_bps = 100
extended_hours_reprice_timeout_secs = 300
close_flatten_reprice_timeout_secs = 60
extended_hours_close_flatten_window_secs = 900
close_flatten_cross_max_bps = 400
# hedge_floor_shares: shares every sell hedge and equity mint leaves in the
# account per symbol, so pricing (which marks from this account's positions)
# never loses a symbol's price; ST0-58. An absent value selects the default
# of 0.01; the floor is enabled by the first build that knows the field. On
# whole-share assets a positive fractional floor rounds up to the next whole
# share. Overridable under
# [assets.equities.SYM]; 0 disables the floor, here for every symbol and
# there for that symbol only. Not written here: the running image refuses
# fields it does not know.

# Travel Rule beneficiary identity for Alpaca whitelist creation.
[broker.travel_rule]
beneficiary_entity_name = "T0 TRADE (BVI) LTD"

# Per-equity hedging policy (broker-side). Chain asset facts live under
# [chains.base.trading.assets].
[assets.equities]
# Symbols deliberately removed from the per-symbol tables while the DB still
# references them (st0x.liquidity#1321). Required since that merge: its
# absence crash-looped the staging bot from 15:38 UTC on 2026-09-02, the
# same drift as hedge_order_gate_reconciliation_timeout_secs the day before.
retired_symbols = []

[chains.base]
# Trades, hedges and rebalances: everything is on, subject to the
# per-asset flags in the token file ([registry] below).
lifecycle = "active"
# Block confirmations required before a submitted transaction is treated as
# settled. Does not govern fill ingestion (controlled by ingestion_cutoff).
required_confirmations = 3

[chains.base.trading]
# Rain Orderbook contract on Base.
orderbook = "0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D"
# Rebalancing settlement mode: "legacy" (settle directly against the orderbook
# with bot-EOA-owned vaults) or "managed" (settle through the shared
# RaindexInventory, which the bot must operate via OPERATOR_ROLE).
#
# Staging settles through its dedicated shared inventory. The Turnkey wallet
# holds OPERATOR_ROLE on this contract; startup fails closed if that changes.
inventory_mode = "managed"
# Public OPERATOR_ROLE holders for venue attribution. Captured Base settlement
# fixtures pin both addresses in src/onchain/trade.rs.
inventory_adapters = [
  { venue = "bebop", operator = "0x8b8b6e0507c125934c6129563f48e48c66f86475" },
  { venue = "uniswap_v4", operator = "0x36ebb1e5149c60111dd035f0417a4b00d39caa88" },
]
inventory = "0x5FE36e6b6c320f8FD0B6109B2315253387DbdeF2"
# REQUIRED. Owner of the Raindex orders/vaults on-chain (vaultBalance2 /
# registry / fill match key). Managed mode scopes all three to the inventory
# contract, not the bot's Turnkey wallet.
vault_owner = "0x5FE36e6b6c320f8FD0B6109B2315253387DbdeF2"
# Block number to start backfilling order events from.
deployment_block = 43259507
# Use the OP-Stack safe block as the fill-ingestion cutoff. This cuts hedging
# lag from ~20 min (finalized) to ~seconds. See example.config.toml for tradeoffs.
ingestion_cutoff = "safe"
# Seconds between fill-watch poll cycles on this chain (required; was the
# global order_fill_poll_interval with a hidden default of 5).
order_fill_poll_interval_secs = 5
# Exactly one hedged chain is the primary: the one whose inventory the bot
# polls and rebalances automatically. Fills are hedged on every hedged chain.
primary = true
# Alpaca's issuer wallet on this chain -- ERC-20 transfers for redemption go
# here. Per chain: a redemption delivers tokens that exist on one chain, so
# sending them to another chain's issuer address would burn them.
redemption_wallet = "0x1c66D6708914C40239D54919320b4C48cAE3D1A9"

# Ethereum is a cash-corridor endpoint only: the bot holds USDC and signs
# there, but runs no orderbook and ingests no fills, so it has no [trading]
# table. Confirmations are deeper than Base's because an L1 reorg is a
# different risk from an OP-Stack sequencer batch.
[chains.ethereum]
# Holds and moves USDC for the corridor; it runs no orderbook, so it has
# no [trading] table.
lifecycle = "active"
required_confirmations = 12

# HyperEVM, same shape as Ethereum.
[chains.hyperevm]
# A signer exists and nothing moves yet. Raising this to "active" fails
# startup: no CCTP domain and no HYPE price source are wired.
lifecycle = "observe-only"
required_confirmations = 1

# Robinhood Chain (an Arbitrum Orbit L2, chain id 4663): a prefunded
# hedge-only secondary. Fills on its orderbook are ingested, validated
# against USDG (pinned in code) and hedged. Gas is ETH. There is one
# Robinhood deployment, so staging watches the same orderbook and inventory
# as prod, on a different broker account. Staging must therefore never
# rebalance Robinhood equity, even though the chain can: the wrappers are
# deployed there and Alpaca serves its network. Prod owns that inventory.

[chains.robinhood]
lifecycle = "prefunded"
# ~1 s at the ~100 ms block cadence: enough for a load-balanced RPC to have
# seen the startup USDG approval before it is treated as settled.
required_confirmations = 10

[chains.robinhood.trading]
# RaindexV6 on Robinhood Chain (st0x.raindex-deploy docs/CHAINS.md).
orderbook = "0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20"
inventory_mode = "managed"
# Bebop's Robinhood RFQ hook; it holds OPERATOR_ROLE on the 4663 inventory.
inventory_adapters = [
  { venue = "bebop", operator = "0x242FdEc55623187E80A690ff15302e63dddd7130" },
]
# The single RaindexInventory on 4663; it owns the orders and vaults, so it
# is the vault owner too. The bot wallet must hold OPERATOR_ROLE on it.
inventory = "0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30"
vault_owner = "0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30"
# Backfill floor: the orderbook's deployment block on 4663 (no code at the
# block before it, code from this one on).
deployment_block = 59557818
# Robinhood is a sequencer-ordered Arbitrum Orbit rollup, so a sequenced fill
# cannot reorg short of a chain-level failure; the cutoff only covers RPC node
# lag (600 blocks is ~1 min at ~100 ms), and hedge lag is the price risk.
ingestion_cutoff = "confirmations"
ingestion_cutoff_confirmations = 600
order_fill_poll_interval_secs = 5
primary = false
# No redemption_wallet: a hedge-only chain redeems nothing.

[chains.robinhood.trading.assets.cash]
# The USDG vault the orders quote against; polled, never rebalanced.
vault_id = "0xfab"
rebalancing = "disabled"

[wallet]
kind = "turnkey"
# Keyless Turnkey authentication (GCP only): requests are stamped by this
# KMS-held P-256 key via the VM's ambient identity, so the secrets file
# carries no [wallet] section at all. See crates/evm/src/gcp_kms_stamper.rs.
kms_api_key = "projects/t0-liquidity-staging/locations/europe-west3/keyRings/t0-liquidity/cryptoKeys/turnkey-api-key/cryptoKeyVersions/1"
# On-chain address controlled by the Turnkey key.
address = "0x16ca08a5825612aAe805D172a81B1a52b43574bf"
# Turnkey organization that owns the signing key.
organization_id = "b100145e-7894-4c17-b3e7-160435f84803"

# Chainlink ETH/USD proxy on Base for bot-gas cost recording (ADR 0020).
# This public address is pinned by a checked-in configuration test.
[bot_gas_valuation]
chainlink_feed = "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"

[rebalancing]
transfer_timeout_secs = 1800
transfer_attempt_timeout_secs = 3600
attestation_retry_deadline_secs = 86400
settlement_retry_deadline_secs = 86400
max_burn_revert_redrives = 5
# An inventory book last polled more than this many seconds ago (or never,
# e.g. right after a restart) is stale: its imbalance checks are skipped with
# a warning until a fresh poll lands. Required (non-zero) since st0x.liquidity
# #1352; the image built from master after that merge refuses to start
# without it.
inventory_staleness_bound_secs = 300
# Dividend freeze guard: query issuance each equity cycle and fail closed when
# the status cannot be confirmed. Set to "disabled" to fail open during an
# issuance outage (issuance secrets stay required, so re-enabling is config-only).
freeze_check = "disabled"
# Equity allocation across the hedged chains: Base keeps the 50% target and
# 20% band the retired `equity` table carried; the broker holds the rest, a
# tenth of it as the hedging reserve. See config/prod for the reasoning.
allocation = { targets = { base = 0.5 }, alpaca_floor = 0.1, deviation = 0.2, min_operation_usd = 10, cooldown_secs = 300 }
usdc = { mode = "disabled" }

[rest_api]
url = "https://api.st0x.io"

# IAP audiences for the role-gated ops API, from the ops_api_audiences output
# of ops-api-iap.tf. The bot pins the audience per path prefix, so a token IAP
# minted for the read backend is refused on the write path even though its
# signature is valid.
#
# Not secrets: an audience names an IAM-gated backend and is useless without an
# identity Google will sign for. Removing this section unmounts the role-gated
# routes entirely.
[ops_api]
read_audience = "/projects/819265953297/global/backendServices/6620592880358364228"
write_audience = "/projects/819265953297/global/backendServices/6816788502563099716"

# Low-gas balance alerting for the bot wallet. Telegram bot_token lives in the
# encrypted secrets file under [alerts]. Every field is required (no defaults).
# Shares the encrypted secret (and thus bot_token) with prod, so this section
# must be present whenever the secret carries [alerts].
[alerts]
# Intentionally bogus chat id so staging alert deliveries fail instead of
# posting into the shared St0x Product Operations supergroup. The field is
# required whenever the shared secret carries [alerts], so it cannot be
# omitted; send failures are logged as warnings and are otherwise harmless.
chat_id = -1
# Forum topic alerts post into (the "DEX Liquidity" topic).
message_thread_id = 50
# Seconds between native-balance polls.
poll_interval = 300
# Minimum seconds between repeated alerts while the balance stays below threshold.
# 1 = re-log on every poll. The 12-hour throttle this used to carry was for
# the Telegram transport; alerts are log lines now, and the Grafana rule
# (rules.yml, liquidity-bot group) treats "Low gas" as a state: it stays
# firing while the line keeps arriving and resolves only once the balance
# is really back above threshold. A long throttle here would make Grafana
# report RESOLVED ten minutes after each re-alert while the wallet is still
# empty. Grafana does the dedup, so the bot no longer needs to.
realert_interval = 1

# Native-gas balance below which low-gas alerts fire, per chain (decimal ETH).
# Required for every chain the gas monitor runs on: one figure cannot be right
# for both an expensive chain and a cheap one. Ethereum's value is
# intentionally L1-calibrated; see SPEC.md.
[alerts.low_balance_thresholds]
base = "0.05"
ethereum = "0.05"
# Robinhood only pays for the startup USDG approval (~50k gas at ~0.05 gwei,
# under 0.00001 ETH), so 0.001 ETH is hundreds of approvals of headroom.
robinhood = "0.001"

# USDC vault and rebalancing settings.
[chains.base.trading.assets.cash]
# Raindex vault ID for USDC deposits/withdrawals.
vault_id = "0xfab"
# Whether automatic USDC rebalancing between venues is active.
rebalancing = "disabled"

# The per-symbol tables ([chains.<c>.trading.assets.equities.<SYM>] and
# [assets.equities.<SYM>]) come from t0.tokens' token file in the bucket.
[registry]
url = "gs://t0-artifacts-tokens/staging/tokens.toml"
