# st0x liquidity bot runtime config for PRODUCTION: the deployed source of
# truth since 2026-09-07 (moved here from t0.devops terraform/production-
# liquidity/st0x-hedge.toml; the stack there keeps only the secret and its
# grants). A merge touching this file is a PRODUCTION CONFIG RELEASE: the
# release workflow validates it inside the exact bot image it rolls (validate-
# config), publishes it as a version of the liquidity-runtime-config secret,
# then rolls the plane only after an approver activates the app-deploy PAM
# grant in the GCP console (.github/workflows/production-release.yml). A
# version tag ships this file together with the new binary; a
# workflow_dispatch on an older tag rolls both back. Non-secret settings only;
# secrets come from Secret Manager env injection.
#
# The VM (t0.devops terraform/production-liquidity) fetches exactly the
# CONFIG_VERSION that images.env names, never `latest`; the release
# workflow writes that line next to the digests it rolls, so image, config
# and the Terraform-pinned secrets version always roll, and roll back,
# together. The release validates this file inside the bot image it rolls
# (the 2026-09-04 crash loop was a field only the newer image knew).
#
# HTTP API port for the dashboard and health checks.
server_port = 8001
# HTTP port for the apalis-board job queue UI.
board_port = 8002
# Minimum stdout log level. Docker's gcplogs driver exports TRACE to GCP.
log_level = "trace"
# Directory and minimum level for local rotated log files. INFO reduces
# within-day volume on the 10 GB SQLite disk; seven-file retention caps file
# count, not bytes, so it is not a hard disk-usage bound.
log_dir = "/mnt/data/logs"
file_log_level = "info"
# SQLite database path for event store, projections, and job queue.
database_url = "sqlite:///mnt/data/st0x-hedge.db"
# How often (seconds) Apalis purges finished background jobs.
apalis_finished_job_cleanup_interval_secs = 3600
# Consecutive offchain polls that must diverge from the inventory view's
# Hedging balance for a symbol before the poller escalates a forced snapshot
# reconciliation.
inventory_divergence_threshold = 10
# Master schema field, unknown to v1.10.0 (the 2026-09-04 crash loop was
# this line landing in production ahead of the image; the release-time
# validator now refuses that). Ships with the next version tag.
hedge_order_gate_reconciliation_timeout_secs = 10

[pricing]
# The pricing plane on Cloud Run for THIS environment. Auth is the VM's
# ambient Google identity (run.invoker on the service, granted in
# t0.devops' pricing stack), an ID token minted per connect, no
# [pricing] secret exists. The droplet's ws://st0x-pricing:8080 was a
# droplet-local container; it never existed on this VM.
ws_url = "wss://st0x-pricing-ccvtustewa-ey.a.run.app/ws"
gcp_id_token = true
# Broker identity (type, mode, account_id, and for the keyless variant
# client_id and kms_key_version) now belongs in this section: it is names and
# identifiers, not credentials. The values for this deployment still live in
# the deployed secrets file's [broker] table (accepted for one more release);
# the next config release moves them here, and only the legacy
# api_key/api_secret pair may stay in secrets.

[broker]
counter_trade_slippage_bps = 100
extended_hours_reprice_timeout_secs = 300
close_flatten_reprice_timeout_secs = 60
extended_hours_close_flatten_window_secs = 900
close_flatten_cross_max_bps = 400
# hedge_floor_shares: shares every sell hedge and equity mint leaves in the
# account per symbol, so pricing (which marks from this account's positions)
# never loses a symbol's price; ST0-58. Absent means the default, 0.01, which
# rounds up to one whole share on whole-share assets; the floor is therefore
# on from the first build that knows it, with no config change. Overridable
# under [assets.equities.SYM]; 0 disables the floor, here for every symbol
# and there for that symbol only. Not written here on purpose: the
# release-time validator runs inside the running image, which refuses fields
# it does not know (see the schema-at-HEAD note above [assets.equities]). The
# floor holds a position, it never creates one: a symbol at zero stays dark
# until a redemption or a manual buy funds it.

# Travel Rule beneficiary identity for Alpaca whitelist creation.

[broker.travel_rule]
beneficiary_entity_name = "T0 TRADE (BVI) LTD"

[chains.base]
# Trades, hedges and rebalances: everything is on, subject to the
# per-asset flags in the token file ([registry] below).
lifecycle = "active"
# Block confirmations required before a submitted transaction is treated as
# settled. Does not govern fill ingestion (controlled by ingestion_cutoff).
required_confirmations = 3

[chains.base.trading]
# Rain Orderbook contract on Base.
orderbook = "0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D"
# Rebalancing settlement mode: "legacy" (settle directly against the orderbook
# with bot-EOA-owned vaults) or "managed" (settle through the shared
# RaindexInventory below, which the bot must operate via OPERATOR_ROLE).
#
# Dedicated production inventory. The wallet must hold OPERATOR_ROLE because
# startup verifies that role explicitly, even when the wallet is also admin.
inventory_mode = "managed"
# Operator addresses that attribute inventory settlements to venues.
inventory_adapters = [
  # NAV-asserting hook. Keep both hooks mapped until the old operator is retired.
  { venue = "bebop", operator = "0x7BDEa3bA0101E06Cbb7f12500ed12eF046148A03" },
  # Pre-NAV hook, being retired.
  { venue = "bebop", operator = "0x3EE87Dcabfb324B2231044928080Dd4E6AC19baE" },
]
inventory = "0x10e4db39275C3b128C01bA1194D45D19aE1520d9"
# REQUIRED. Owner used for vault balances, registry entries, and order-fill
# matching. Managed mode requires this to equal `inventory`.
vault_owner = "0x10e4db39275C3b128C01bA1194D45D19aE1520d9"
# Backfill floor. No inventory-owned event can predate its deployment block; an
# existing later checkpoint still resumes at checkpoint + 1.
deployment_block = 49746968
# Use the OP-Stack safe block as the fill-ingestion cutoff. This cuts hedging
# lag from ~20 min (finalized) to ~seconds. See example.config.toml for tradeoffs.
ingestion_cutoff = "safe"
# Seconds between fill-watch poll cycles on this chain (required; was the
# global order_fill_poll_interval with a hidden default of 5).
order_fill_poll_interval_secs = 5
# Exactly one hedged chain is the primary: it must be active, it always
# carries the rebalancing services, and it is the default --network for
# operator commands. Each rebalancing chain polls its own wallet and
# recovers its own transfers (Robinhood rebalances its own DNUT); fills
# are hedged on every hedged chain.
primary = true
# Alpaca's issuer wallet on this chain -- ERC-20 transfers for redemption go
# here. Per chain: a redemption delivers tokens that exist on one chain, so
# sending them to another chain's issuer address would burn them.
redemption_wallet = "0x3d0CD66EFA66c05d86c3d4316B03eAE87ab9E8aE"

# Ethereum is a cash-corridor endpoint only: the bot holds USDC and signs
# there, but runs no orderbook and ingests no fills, so it has no [trading]
# table. Confirmations are deeper than Base's because an L1 reorg is a
# different risk from an OP-Stack sequencer batch.

[chains.ethereum]
# Holds and moves USDC for the corridor; it runs no orderbook, so it has
# no [trading] table.
lifecycle = "active"
required_confirmations = 12

# HyperEVM, same shape as Ethereum.

[chains.hyperevm]
# A signer exists and nothing moves yet. Raising this to "active" fails
# startup: no CCTP domain and no HYPE price source are wired.
lifecycle = "observe-only"
required_confirmations = 1

# Robinhood Chain (an Arbitrum Orbit L2, chain id 4663): an active
# secondary. Fills on its orderbook are ingested, validated against USDG
# (pinned in code) and hedged on Alpaca. Equity rebalances against Alpaca
# (mint, wrap, deposit and back) for the listings the token file enables;
# cash does not, since USDG has no corridor yet. Staging watches the same
# inventory and stays hedge-only, so only prod moves it. Gas is ETH.
#
# Rollback: this release also ships the recovery stack (RAI-2596, release R
# in SPEC.md), so the previous release is a binary below R. A tag rollback
# is safe only before this release has run any equity operation on any
# chain: every redemption it runs, on Base too, records a SendPrepared event
# the previous release cannot load. So if the switch-on release does not
# boot, roll back to the previous release. Once it has moved equity, the
# stop is a paused generation on this release, or a roll forward. To pause,
# publish a st0x.registry generation with the listing's Robinhood
# rebalancing at "paused" and bump [registry].generation here; this file
# cannot set it, since [registry] refuses inline equities tables. "paused"
# still runs the Robinhood startup preflights (OPERATOR_ROLE, approvals,
# issuer and wrapper), so it does not fix a release that fails to boot. A
# binary rollback after that follows SPEC.md's rules for going below R.
# Reverting only this table to "prefunded" fails validate-config while the
# token file enables Robinhood rebalancing.
#
# Neither state is neutral for DNUT. "paused" keeps Robinhood's vault in
# the total but stops it redeeming, so sells into that vault drain the
# broker's DNUT toward the hedge floor with no planner action: keep the
# pause short and watch the broker's DNUT position. "disabled" drops the
# vault from the total, so Base (target 0.4, no operational_limit) is far
# over its band and redeems down to its target, several hundred DNUT, in
# one operation. Restoring Base DNUT to 0.5 avoids that only before the
# switch-on mints; after them Base still holds over 0.55 of Base + Alpaca.
# So a generation that disables Robinhood DNUT also pauses Base DNUT, or
# sets its target_share within 0.05 of Base / (Base + Alpaca) at live
# balances, or the operator expects that redemption.

[chains.robinhood]
lifecycle = "active"
# ~1 s at the ~100 ms block cadence: enough for a load-balanced RPC to have
# seen a transaction before it is treated as settled. It gates the startup
# USDG, wrap and deposit approvals and every wrap, deposit, withdrawal,
# unwrap and redemption transfer on 4663.
required_confirmations = 10

[chains.robinhood.trading]
# RaindexV6 on Robinhood Chain (st0x.raindex-deploy docs/CHAINS.md).
orderbook = "0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20"
inventory_mode = "managed"
# Bebop's Robinhood RFQ hook; it holds OPERATOR_ROLE on the 4663 inventory.
inventory_adapters = [
  { venue = "bebop", operator = "0x242FdEc55623187E80A690ff15302e63dddd7130" },
]
# The single RaindexInventory on 4663; it owns the orders and vaults, so it
# is the vault owner too. The bot wallet must hold OPERATOR_ROLE on it.
inventory = "0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30"
vault_owner = "0x1eFd85E6C384fAD9B80C6D508E9098Eb91C4eD30"
# Backfill floor: the orderbook's deployment block on 4663 (no code at the
# block before it, code from this one on).
deployment_block = 59557818
# Robinhood is a sequencer-ordered Arbitrum Orbit rollup, so a sequenced fill
# cannot reorg short of a chain-level failure; the cutoff only covers RPC node
# lag (600 blocks is ~1 min at ~100 ms), and hedge lag is the price risk.
ingestion_cutoff = "confirmations"
ingestion_cutoff_confirmations = 600
order_fill_poll_interval_secs = 5
primary = false
# Alpaca's issuer wallet on this chain, where redemption transfers go.
# st0x.issuance signs every chain with one key and its redemption poller
# watches transfers to that key's address, so this equals Base's. That
# address has sent transactions on 4663 (nonce 556 on 2026-10-06).
redemption_wallet = "0x3d0CD66EFA66c05d86c3d4316B03eAE87ab9E8aE"

[chains.robinhood.trading.assets.cash]
# The USDG vault the orders quote against; polled, never rebalanced.
vault_id = "0xfab"
rebalancing = "disabled"

[wallet]
# Keyless Turnkey auth: the API key lives in Cloud KMS; the secrets file
# carries no api_private_key. Key minted by t0.devops #270 (2026-08-14).
kms_api_key = "projects/t0-liquidity/locations/europe-west3/keyRings/t0-liquidity/cryptoKeys/turnkey-api-key/cryptoKeyVersions/1"
kind = "turnkey"
# On-chain address controlled by the Turnkey key.
address = "0xA9C16673F65AE808688cB18952AFE3d9658C808f"
# Turnkey organization that owns the signing key.
organization_id = "b100145e-7894-4c17-b3e7-160435f84803"

# Chainlink ETH/USD proxy on Base for bot-gas cost recording (ADR 0020).
# This public address is pinned by a checked-in configuration test.

[bot_gas_valuation]
chainlink_feed = "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"

[rebalancing]
transfer_timeout_secs = 1800
# Required by the master schema, unknown to v1.10.0 (see the schema-at-HEAD
# note above [assets.equities]): skip a chain's rebalancing evaluations
# when its inventory snapshot is older than this bound (or absent, e.g.
# right after a restart).
inventory_staleness_bound_secs = 300
transfer_attempt_timeout_secs = 3600
attestation_retry_deadline_secs = 86400
max_burn_revert_redrives = 5
# NOTE: [rebalancing].inventory_staleness_bound_secs is REQUIRED by every
# bot image built after st0x.liquidity #1352 and REJECTED ("unknown field",
# the config parser is strict) by every image before it, including the
# v1.10.0 digest pinned in images.yaml. Add it in the SAME PR that rolls
# the image forward, never ahead of it: adding it early (t0.devops #436)
# crash-looped the production bot for hours on 2026-09-04.
# Dividend freeze guard: query issuance each equity cycle and fail closed when
# the status cannot be confirmed. Set to "disabled" to fail open during an
# issuance outage (issuance secrets stay required, so re-enabling is config-only).
freeze_check = "enabled"

[rebalancing.usdc]
mode = "enabled"
# Transitional: the released image reads these two. This build requires
# them to equal [rebalancing.usdc.corridors.base] and ignores them
# otherwise. Deleted, and then refused by name, once a release that reads
# corridors is live.
target = 0.6
deviation = 0.05

# One table per cash corridor, keyed by the chain whose vault it serves.
# Every corridor routes through the bot's Ethereum wallet, where Alpaca
# deposits and withdraws.
# hop: how USDC crosses between that chain and Ethereum. "cctp" (Circle
#   burn and mint) on Base. "relay" is reserved for Robinhood and refused
#   by this build.
# target: the chain vault's share of (that vault's USDC + Alpaca cash).
# deviation: the band around target inside which nothing moves.
[rebalancing.usdc.corridors.base]
hop = "cctp"
target = 0.6
deviation = 0.05

# Equity allocation across the hedged chains (st0x.liquidity RAI-2082). Base
# keeps the 50% target and 5% band the retired [rebalancing.equity] table
# carried. Robinhood gets no chain-wide target: each listing it rebalances
# sets its own target_share in the token file, and validation refuses one
# that does not. Ethereum runs no orderbook. alpaca_floor only caps mints:
# no mint takes the broker below a tenth of the equity's total. Nothing
# redeems when the broker is under it, so a symbol rebalanced on two chains
# needs targets whose upper bands leave the floor: DNUT's Base and Robinhood
# rows in the token file both set target_share = 0.4, and 0.45 + 0.45 keeps
# the broker at or above 0.1 only while Robinhood redeems as fast as it goes
# over its band: 25 DNUT per operation (its operational_limit), one at a
# time and at least cooldown_secs apart, about 300 an hour. Sustained sells
# into the Robinhood vault hedge faster than that and take the broker below
# 0.1, down to the hedge floor. The two DNUT rows also plan as one: while
# Robinhood's DNUT poll is older than inventory_staleness_bound_secs or a
# Robinhood DNUT transfer runs, Base DNUT neither mints nor redeems either.
# equity_plan_declined_total has only a reason label, so watch the
# "Declined equity plan" logs instead: symbol DNUT, chain robinhood, reason
# chain_stale or chain_unpolled (inflight is logged per symbol, no chain).
# min_operation_usd sits two orders of magnitude above a Base mint's gas
# while still letting the cheapest listings rebalance; cooldown_secs matches
# the inventory staleness bound, so a limit-truncated transfer re-fires once
# per poll window, not every tick.
[rebalancing.allocation]
targets = { base = 0.5 }
alpaca_floor = 0.1
deviation = 0.05
min_operation_usd = 10
cooldown_secs = 300

[rest_api]
url = "https://api.st0x.io"

# Issuance internal status API for the rebalancing freeze guard. The
# non-secret base_url belongs here, in this config file's [issuance] section
# (only the api_key is a secret); this deployment still carries it in the
# deployed secrets file, accepted for one more release.
# [issuance]
# base_url = "..."

# Low-gas balance alerting for the bot wallet. Alerts are structured ERROR
# logs (target "operational_alert"); delivery to humans happens downstream via
# the log pipeline (Cloud Logging -> Grafana alert rules). Every field is
# required (no defaults).

[alerts]
# Seconds between native-balance polls.
poll_interval = 300
# Minimum seconds between repeated alerts while the balance stays below threshold.
# 1 = re-log on every poll. The 12-hour throttle this used to carry was for
# the Telegram transport; alerts are log lines now, and the Grafana rule
# (rules.yml, liquidity-bot group) treats "Low gas" as a state: it stays
# firing while the line keeps arriving and resolves only once the balance
# is really back above threshold. A long throttle here would make Grafana
# report RESOLVED ten minutes after each re-alert while the wallet is still
# empty. Grafana does the dedup, so the bot no longer needs to.
realert_interval = 1

# Native-gas balance below which low-gas alerts fire, per chain (decimal ETH).
# Required for every chain the gas monitor runs on: one figure cannot be right
# for both an expensive chain and a cheap one.
#
# Ethereum = THREE DAYS of gas (Kais, 2026-09-07), not a round number. The
# wallet only pays for USDC rebalancing transfers on L1. Measured from the
# bot's own balance log lines: 0.0003-0.00035 ETH per trading day in the
# week of 2026-08-31, 0.0116 ETH in the busiest week on record (~0.0017 per
# day). Three days at the busiest rate is 0.005. The old 0.05 was 30+ days
# of gas and sat firing for a week (0.031 ETH, 2026-09-03 onwards) while
# the wallet had months left. Re-measure and raise this if rebalancing
# frequency or L1 gas prices change.

[alerts.low_balance_thresholds]
base = "0.05"
ethereum = "0.005"
# Robinhood pays for the startup approvals and about four transactions per
# equity mint or redemption (wrap or unwrap, vault deposit or withdraw, the
# redemption transfer). At ~0.05 gwei each is under 0.00001 ETH. This is
# also the equity gas gate: below it, the bot refuses every Robinhood
# operation until the wallet is topped up, so 0.001 ETH is a balance the
# wallet must keep, not headroom it can spend. Fund it with this threshold
# plus the expected spend.
robinhood = "0.001"

# USDC vault and rebalancing settings.

[chains.base.trading.assets.cash]
# USDC vault used by Bebop and cash rebalancing. The inventory keys vaults by
# (token, vaultId), so both paths must use the same vault.
vault_id = "0xfab"
# Whether automatic USDC rebalancing between venues is active.
rebalancing = "enabled"
# Maximum USDC moved per rebalance operation.
operational_limit = 25000

# Schema-at-HEAD note (2026-09-07): `retired_symbols` is REQUIRED by the
# config schema on master but unknown to v1.10.0, the build production
# runs. This file therefore parses at HEAD (loader tests, config-drift)
# but is refused by the release-time validator until a build that knows
# the field is tagged: the first liquidity production release after the
# hand-over must be a version tag, not a config-only release, and
# config-check stays red on this file until that tag exists. Empty on
# purpose: QSEP is still in the token file (as production runs it). Listing a
# symbol here drops its rows from the token file at the merge, so retire it
# here first; its rows in st0x.registry can go afterwards (see
# docs/how-to-add-new-asset.md, "Retiring an asset").
[assets.equities]
retired_symbols = []

# The per-symbol tables ([chains.<c>.trading.assets.equities.<SYM>] and
# [assets.equities.<SYM>]) come from st0x.registry's token file in the bucket.
[registry]
url = "gs://t0-artifacts-tokens/production/tokens.toml"
generation = 1791378253362331
