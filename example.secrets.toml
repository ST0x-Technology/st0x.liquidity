# Only the legacy credential pair lives here; the broker identity (type,
# mode, account_id, and for the keyless variant client_id and
# kms_key_version) lives in the CONFIG file's [broker] section. The type tag
# stays because it names the credential shape. With the keyless
# alpaca-broker-api-kms broker, omit this table entirely: the
# keyless table migrates all-or-nothing (its fields stay required while it
# exists here; delete the whole table once the config carries the identity).
[broker]
type = "alpaca-broker-api"
api_key = "test_key"
api_secret = "test_secret"

# Local-key alternative for development and sandbox use: sign the same
# RFC 7523 client assertions with the EC private key that BrokerDash
# exports for a private_key_jwt credential. The path points at the
# exported PEM file (SEC1 or PKCS#8); the bot reads it once at startup.
# The key file IS a secret — keep it out of the repository. The token
# endpoint follows mode: sandbox uses authx.sandbox.alpaca.markets,
# production uses authx.alpaca.markets.
# [broker]
# mode = "sandbox"
# type = "alpaca-broker-api-jwt"
# client_id = "CKEXAMPLE"
# private_key_pem_path = "/path/to/alpaca-sandbox.pem"
# account_id = "dddddddd-eeee-aaaa-dddd-beeeeeeeeeef"

# Wallet secrets — backend-specific credentials.
[wallet]
private_key = "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# For kind = "turnkey" (in config), use instead:
# [wallet]
# Use your Turnkey P-256 API private key: 64 hex characters encoding a valid
# nonzero scalar; an optional 0x prefix is accepted. Replace this placeholder.
# api_private_key = "replace-with-your-64-hex-character-api-private-key"
#
# With kms_api_key set in the CONFIG [wallet] section (KMS-stamped,
# keyless Turnkey auth), omit this file's [wallet] section entirely.

# Optional — REST API credentials for the Orders dashboard tab.
# Only needed when [rest_api] is configured in the config file.
# [rest_api]
# key_id = "your-key-id"
# key_secret = "your-key-secret"

# Required: issuance internal status API key for the rebalancing freeze
# guard. The base_url lives in the CONFIG file's [issuance] section; only the
# api_key belongs here. It is the 32-byte secret issuance generates with
# `openssl rand -hex 32`. Write it here as hex (0x-prefix optional); the bot
# strips the prefix and sends the bare 64-char lowercase hex in the X-API-KEY
# header. Issuance authenticates by a raw string byte-compare (it does NOT
# hex-decode), so its ISSUER_API_KEY MUST hold that exact bare lowercase-hex
# string (not 0x-prefixed, not uppercase) or every request 401s.
[issuance]
api_key = "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Required when equity assets are configured. Obtain a consumer-scoped key
# from the pricing service's PRICING_API_KEYS configuration.
[pricing]
api_key = "replace-with-pricing-api-key"

# Required when any [rebalancing.usdc.corridors.<chain>] table sets
# hop = "relay": Relay refuses every quote without an API key, so a Relay
# corridor without this table fails startup. Without a Relay corridor the key
# is optional and kept. Request one at https://docs.relay.link/references/api/api-keys
[relay]
api_key = "replace-with-relay-api-key"

# Operational alerts need no secrets: they are structured ERROR logs, and
# delivery to humans happens downstream via the log pipeline. A leftover
# [alerts] table (the retired Telegram bot_token) is accepted and ignored for
# one release, then rejected.
