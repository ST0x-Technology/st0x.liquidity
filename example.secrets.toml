# One RPC endpoint per chain, matching the [chains.<name>] tables in the config
# file. Every chain named there needs an entry here and vice versa: a chain with
# addresses but no endpoint, or an endpoint for a chain with no addresses, are
# both states where fund routing is undefined, so either fails startup.
#
# The trading chain's endpoint drives continuous eth_getLogs fill polling and
# every read-only contract call (single transport, no WebSocket). Each endpoint
# also signs for its chain when [wallet] is configured.
#
# Each endpoint must be an archive node, or must otherwise retain state back to
# the oldest block a read pins to: the block-pinned bot-gas ETH/USD valuation
# (ADR 0020) reads a historic block and fails against a pruned node once that
# block ages out.
[chains.base]
rpc_url = "https://base-mainnet.example.com/YOUR_API_KEY"

[chains.ethereum]
rpc_url = "https://mainnet.infura.io/v3/YOUR_PROJECT_ID"

[chains.hyperevm]
rpc_url = "https://rpc.hyperliquid.xyz/evm"

[broker]
mode = "sandbox"
type = "alpaca-broker-api"
api_key = "test_key"
api_secret = "test_secret"
account_id = "dddddddd-eeee-aaaa-dddd-beeeeeeeeeef"

# Keyless alternative (no stored credential): the bot signs RFC 7523
# client assertions with a Cloud KMS key whose public half is registered
# on a BrokerDash credential, and buys 15-minute bearer tokens. Neither
# value is a secret; the section stays here so [broker] lives in one
# place. Requires roles/cloudkms.signerVerifier on the VM's service
# account.
# [broker]
# mode = "production"
# type = "alpaca-broker-api-kms"
# client_id = "CKEXAMPLE"
# kms_key_version = "projects/p/locations/l/keyRings/r/cryptoKeys/alpaca-api-key/cryptoKeyVersions/1"
# account_id = "dddddddd-eeee-aaaa-dddd-beeeeeeeeeef"

# Wallet secrets — backend-specific credentials.
[wallet]
private_key = "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# For kind = "turnkey" (in config), use instead:
# [wallet]
# api_private_key = "hex-encoded-p256-api-private-key"
#
# With kms_api_key set in the CONFIG [wallet] section (KMS-stamped,
# keyless Turnkey auth), omit this file's [wallet] section entirely.

# Optional — REST API credentials for the Orders dashboard tab.
# Only needed when [rest_api] is configured in the config file.
# [rest_api]
# key_id = "your-key-id"
# key_secret = "your-key-secret"

# Required — issuance internal status API for the rebalancing freeze guard.
# Both base_url and api_key live here (issuance is not on the internal network
# yet). base_url is the issuance HTTP origin; api_key is the 32-byte secret
# issuance generates with `openssl rand -hex 32`. Write it here as hex
# (0x-prefix optional); the bot strips the prefix and sends the bare 64-char
# lowercase hex in the X-API-KEY header. Issuance authenticates by a raw string
# byte-compare (it does NOT hex-decode), so its ISSUER_API_KEY MUST hold that
# exact bare lowercase-hex string — not 0x-prefixed, not uppercase — or every
# request 401s.
[issuance]
base_url = "http://issuance.internal:8000"
api_key = "0x0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

# Required when equity assets are configured. Obtain a consumer-scoped key
# from the pricing service's PRICING_API_KEYS configuration.
[pricing]
api_key = "replace-with-pricing-api-key"

# Optional — Telegram bot token for low-gas alerting.
# Only needed when [alerts] is configured in the config file.
# [alerts]
# bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
