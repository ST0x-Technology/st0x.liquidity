      # Data-disk usage on the liquidity VM. The bot's rotated file logs share
      # the 10 GB data disk with its SQLite database; when the disk fills,
      # writes fail with "database or disk is full" while /health stays
      # green: production went through exactly that on 2026-08-30 and
      # 2026-09-02 with nobody paged. The VM's hourly logprune timer
      # (gcp-bot-vm) keeps usage under 60%; this rule is the backstop for
      # anything else that fills the disk (WAL growth, a runaway file).
      - uid: t0liqdiskprd
        title: liquidity-data-disk-production
        condition: C
        data:
          - refId: A
            queryType: timeSeriesList
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: cloudmon
            model:
              datasource: {type: stackdriver, uid: cloudmon}
              queryType: timeSeriesList
              refId: A
              instant: true
              intervalMs: 60000
              timeSeriesList:
                projectName: t0-liquidity
                filters:
                  - "metric.type"
                  - "="
                  - "agent.googleapis.com/disk/percent_used"
                  - AND
                  - "metric.labels.device"
                  - "="
                  - "/dev/sdb"
                  - AND
                  - "metric.labels.state"
                  - "="
                  - "used"
                alignmentPeriod: +300s
                perSeriesAligner: ALIGN_MEAN
                crossSeriesReducer: REDUCE_MAX
                preprocessor: none
                groupBys: []
                view: FULL
          - refId: B
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: math
              expression: "$B > 80"
              refId: C
        # The Ops Agent ships this gauge continuously; no data means the agent
        # or the VM is gone, which the roll-timer/health routines already
        # cover, so stay quiet here rather than double-page.
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: Production liquidity VM data disk above 80%
          description: >-
            The Production liquidity VM's data disk (/dev/sdb, mounted at /mnt/data, shared by the bot's SQLite database and its rotated file logs) has been above 80% for 10 minutes. At 100% the database fails writes while /health stays green. Check the logprune timer first (journalctl -u t0-liquidity*-logprune), then du -sh /mnt/data/logs.
        labels: {service: liquidity, severity: critical}

      # ---- token file (registry) reloads ------------------------------------
      # The bot polls gs://t0-artifacts-tokens/production/tokens.toml every
      # 10s, judges each new generation, and restarts onto an accepted one
      # (st0x.liquidity src/registry_reload.rs, src/registry_boot.rs). Its
      # /metrics reach Cloud Monitoring through the Ops Agent prometheus
      # receiver, so the names below are the bot's own, with no prefix.
      #
      # A refused token file has no rule: the registry and the bot's pinned
      # config often differ for a while during normal rollouts, so
      # registry_invalid is not worth a page.
      #
      # The rule reads a gauge, not registry_reloads_total. start_failed and
      # fallback are counted once, at the boot that creates the fallback, so
      # each counter is born at 1 in a new process and never moves again.
      # An increase over a window can miss that first sample. The fallback
      # time is a gauge that later boots restore from state.json, which
      # makes it a reliable read. start_failed has no rule of its own: the
      # bot counts it in the same call as fallback, so a second rule would
      # page twice for one event.
      #
      # NoData is the healthy state before the bot runs the reload code and
      # whenever there is no fallback. execErrState OK, as for the per-kind
      # rules above: until the bot first exports these names the metric
      # descriptor does not exist and Cloud Monitoring answers with an error.
      #
      # The bot accepted a new token file and restarted onto it, and it did
      # not start twice in a row. The bot then booted the last good tables
      # with the listings that copy added switched off, and it retries the
      # failed copy after 30 minutes, then 1h, 2h and so on. The gauge holds
      # the time of the last fallback, so this fires for one hour after it.
      # One hour covers the first retry: a copy that fails again at that
      # retry moves the time forward and the alert stays open. VictoriaMetrics
      # supplies the clock, as in oracle-registry-check-stale-production.
      - uid: t0liqregfallprd
        title: liquidity-token-file-fallback-production
        condition: F
        data:
          - refId: A
            queryType: timeSeriesList
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: cloudmon
            model:
              datasource: {type: stackdriver, uid: cloudmon}
              queryType: timeSeriesList
              refId: A
              instant: true
              intervalMs: 60000
              timeSeriesList:
                projectName: t0-liquidity
                filters:
                  - "metric.type"
                  - "="
                  - "prometheus.googleapis.com/registry_last_reload_timestamp_seconds/gauge"
                  - AND
                  - "metric.labels.result"
                  - "="
                  - "fallback"
                alignmentPeriod: 60s
                perSeriesAligner: ALIGN_MAX
                crossSeriesReducer: REDUCE_MAX
                preprocessor: none
                groupBys: []
                view: FULL
          - refId: B
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: reduce
              reducer: last
              expression: A
              refId: B
          - refId: C
            queryType: ""
            relativeTimeRange: {from: 60, to: 0}
            datasourceUid: victoriametrics
            model:
              datasource: {type: prometheus, uid: victoriametrics}
              expr: time()
              instant: true
              refId: C
          - refId: D
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: reduce
              reducer: last
              expression: C
              refId: D
          - refId: E
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: math
              expression: $D - $B
              refId: E
          - refId: F
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: math
              expression: "$E < 3600"
              refId: F
        noDataState: OK
        execErrState: OK
        for: 0m
        annotations:
          summary: >-
            Production liquidity bot could not start on the latest token file and fell back to its last good tokens. Check the bot's error log for the generation and reason, then fix or revert the file in st0x.registry.
          description: >-
            The bot accepted the latest copy of gs://t0-artifacts-tokens/production/tokens.toml and restarted onto it, and that copy failed to start twice. The bot now runs its last good tables, with the listings the failed copy added switched off. It tries the failed copy again after 30 minutes, then after 1h, 2h and so on, and each try costs more restarts. Read the boot error: gcloud logging read '"failed to start twice"' --project t0-liquidity --freshness 1d. Read the lines before it for why the copy crashed. Then fix t0/production.toml in st0x.registry, or publish the previous file again. This rule holds for one hour after the last fallback ({{ humanizeDuration $values.E.Value }} ago) and then resolves. That RESOLVED means "no new fallback", not "fixed".
        labels: {service: liquidity, severity: critical}
