      - uid: t0liqopsunclprd
        title: liquidity-operational-alert-unclassified-production
        condition: C
        data:
          - refId: A
            queryType: timeSeriesList
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: cloudmon
            model:
              datasource: {type: stackdriver, uid: cloudmon}
              queryType: timeSeriesList
              refId: A
              instant: true
              intervalMs: 60000
              timeSeriesList:
                projectName: t0-liquidity
                filters:
                  - "metric.type"
                  - "="
                  - "logging.googleapis.com/user/operational_alerts"
                  - AND
                  # One regex, not one != clause per kind: Grafana sends `!=~` as
                  # kind!=monitoring.regex.full_match("..."). 68 clauses made a
                  # 4,235-character filter; this one is about 2,790. Cloud
                  # Monitoring documents a 2,048-character limit only for
                  # alert-policy condition filters, none for timeSeries.list;
                  # execErrState Error below pages if the API ever refuses it.
                  # The alternation is the extractor's, verbatim and in its
                  # order; no phrase holds a regex metacharacter. One phrase per
                  # line: the `\` at each line end joins them with nothing between.
                  - "metric.labels.kind"
                  - "!=~"
                  - "Low gas|Gas recovered|Portfolio snapshot mark stale|Portfolio snapshot mark missing|inventory vault under-funded|Raindex vault withdraw failed|Job failed after retries|exceeds nominal|burn submission inconclusive|USDC rebalancing is LATCHED on startup with no automated recovery|timed out after CCTP burn|market-maker wallet already holds|Fill on DISABLED asset|the USDC shortfall check is off|short of the credits of the open USDC transfers|credited less USDC than requested|the CCTP mint cannot be resolved automatically|the burned USDC cannot be minted automatically|complete with no tx hash|the attested CCTP message does not match the recorded nonce|the recorded CCTP message cannot mint on Base|the CCTP mint on Base did not complete|share one Alpaca withdrawal tx|Cannot tell whether a signed Alpaca deposit send was persisted|Could not list signed Alpaca deposit sends at startup|Signed Alpaca deposit sends with unparseable transfer ids were not restored|Could not load a transfer with a signed Alpaca deposit send|Could not rebroadcast a signed Alpaca deposit send at startup|could not be rebroadcast at startup|later sends from the Ethereum wallet queue behind its nonce|deposit marked failed for operator reconciliation|is already recorded by USDC rebalance|USDC transfer corridor mismatch|USDC rebalancing is LATCHED on every corridor with no automated recovery|USDC rebalancing is BLOCKED on every corridor|against durable Position state|whose hash the node cannot return at startup|Raindex vault withdrawal has stayed unconfirmed|exhausted its transfer job budget|completes automatically once issuance accepts|stays in MintAccepted until resolved on the issuance side|exceeded the transfer timeout with an uncertain provider outcome|carries a standing delta|Residual exposure remains after the latched close|currently stuck at CCTP mint recovery|structurally-dead Alpaca integration|consecutive reschedules|withdrawal polling inconclusive|attestation retry deadline elapsed|classified dropped|no longer in the mempool|could not be durably recorded|RecordPendingBurn could not be committed|burn submit-and-record task panicked|before forcing this rebalance either way|No withdrawal was attempted|per-attempt timeout redrive limit reached|per-attempt timeout has retried|burn revert redrive limit reached|burn revert has retried|vault-withdrawal scan has stayed inconclusive|settlement retry deadline elapsed|to the market-maker wallet against nominal|USDC credit of withdrawal tx|no recorded withdrawal tx hash|Dashboard trade delivery failed after retries|Mint authorization delivery failed all retries|Interrupted tokenization aggregate failed all resume retries"
                alignmentPeriod: +900s
                perSeriesAligner: ALIGN_DELTA
                crossSeriesReducer: REDUCE_SUM
                preprocessor: none
                groupBys:
                  - metric.label.kind
                  - metric.label.token
                  - metric.label.job
                  - metric.label.chain
                  - metric.label.wallet
                view: FULL
          - refId: B
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: reduce
              reducer: sum
              expression: A
              refId: B
          - refId: C
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {name: Expression, type: __expr__, uid: __expr__}
              type: math
              expression: "$B > 0"
              refId: C
        noDataState: OK
        # Error, unlike the per-kind rules: this is the net under all of them,
        # so a query the API refuses (a filter too long, a bad regex) must
        # page, not go quiet.
        execErrState: Error
        for: 0m
        annotations:
          summary: >-
            Production liquidity bot: an operational alert of a kind the extractor does not know
          description: >-
            The Production liquidity bot logged an operational alert whose message matches none of the phrases the operational_alerts logs-based metric extracts as `kind`, so no per-kind rule owns it. Read the line: gcloud logging read '"operational_alert"' --project t0-liquidity --freshness 1h. Then teach it: add the phrase to the `kind` extractor in terraform/modules/observability-consumer/main.tf and give it a rule of its own in this group. This rule relays each line for 15 minutes and then resolves; that RESOLVED means "no new occurrence", not "fixed".
        labels: {service: liquidity, severity: critical}
      # An empty inventory vault is a state, not an event. The per-kind rules
      # above relay each log line and clear 15 minutes later, which is right
      # for a failed job and wrong for "vault could cover 0": the desk
      # keeps quoting inventory it does not hold until someone acts. This rule
      # holds for six hours from the last line. Replayed over the 30 days before
      # it shipped, the kind appeared on exactly one day, 2026-09-11, when the
      # bot logged it six times from 14:51Z while the vault was being drained
      # through a mispriced quote; it was the first readable sign of the
      # incident and it reached Zulip as "operational alert: st".
      #
      # The metric labels the vault by token address only. The summary and
      # description name it from a list of the derivative (wt*) addresses in
      # equity_tokens and robinhood_equity_tokens in T0Trade/t0.devops
      # terraform/production-observability/main.tf, EIP-55 checksummed the way
      # the bot logs them. The same list is in liquidity-vault-withdraw-failed-
      # production. Add a new asset to both, or its alert shows a bare address.
      - uid: t0liqvaultempty1
        title: liquidity-inventory-vault-empty-production
        condition: C
        data:
          - refId: A
            queryType: timeSeriesList
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: cloudmon
            model:
              datasource: {type: stackdriver, uid: cloudmon}
              queryType: timeSeriesList
              refId: A
              instant: true
              intervalMs: 60000
              timeSeriesList:
                projectName: t0-liquidity
                filters:
                  - "metric.type"
                  - "="
                  - "logging.googleapis.com/user/operational_alerts"
                  - AND
                  - "metric.labels.kind"
                  - "="
                  - "inventory vault under-funded"
                alignmentPeriod: +900s
                perSeriesAligner: ALIGN_DELTA
                crossSeriesReducer: REDUCE_SUM
                preprocessor: none
                groupBys:
                  - metric.label.token
                  - metric.label.job
                view: FULL
          - refId: B
            queryType: expression
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
