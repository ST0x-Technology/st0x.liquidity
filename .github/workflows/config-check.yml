name: config-check

# PR guard for the deployed configs: each candidate is parsed by the
# validate-config binary inside the newest RELEASED bot image (highest v*
# label in the registry). Early warning only; the release itself
# re-validates against the exact digest it rolls. config-drift.yml guards
# the other direction (this ref's schema against the same files).

on:
  pull_request:
    paths:
      - "config/staging/st0x-hedge.toml"
      - "config/prod/st0x-hedge.toml"
      - ".github/workflows/config-check.yml"

jobs:
  validate:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/config-check.yml@cae26fdb27c048ba9d9d203e5c633892a27dd4aa # config-check, bump via PR
    with:
      config_files: config/staging/st0x-hedge.toml config/prod/st0x-hedge.toml
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-liquidity
      image: t0-liquidity
      service_account: liquidity-labeler@t0-artifacts.iam.gserviceaccount.com
      validate_entrypoint: /bin/validate-config
      validate_command: --config /candidate.toml
