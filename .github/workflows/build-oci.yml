name: build-oci

# Liquidity bot + dashboard OCI images → t0-artifacts Artifact Registry
# (t0-liquidity repo), mirroring st0x.bebop's deploy-cloudrun.yml: nix build
# the flake's dockerTools images → push digests → sign (GitHub/Sigstore +
# the t0-artifacts liquidity-image KMS attestor) → roll staging.
#
# A MERGE TO MASTER DEPLOYS STAGING (roll-staging job at the bottom), like
# pricing, bebop and the oracle. The difference is only the mechanism: those
# planes are Cloud Run, this one is a GCE VM that pulls its deploy state, so
# the job writes the digests into that state object instead of calling
# `gcloud run deploy`. The VM still verifies the liquidity-image attestation
# of everything it adopts. (Until 2026-08-21 there was no deploy job here and
# promoting a digest was a PR in t0.devops; the gates that stay a PR there are
# listed in terraform/staging-liquidity/README.md.)
#
# Auth: GitHub OIDC → the t0-artifacts WIF provider, bound to
# liquidity-deployer (master only — the WIF binding lives in t0.devops
# terraform/production-artifacts/liquidity.tf). PRs get nothing.
#
# Coexists with deploy-staging.yaml / deploy-prod.yaml (the DO droplet
# deploy-rs path) until the staging cutover retires the staging half.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: build-oci
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # GitHub/Sigstore provenance attestation on every pushed digest.
  attestations: write

env:
  REGION: europe-west3
  AR_REPO: europe-west3-docker.pkg.dev/t0-artifacts/t0-liquidity
  # t0-artifacts hub WIF provider (same as oracle/pricing/bebop;
  # st0x.liquidity is admitted via extra_repos, bound to liquidity-deployer).
  WIF_PROVIDER: projects/684788085322/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  DEPLOYER_SA: liquidity-deployer@t0-artifacts.iam.gserviceaccount.com
  ATTESTOR: projects/t0-artifacts/attestors/liquidity-image
  ATTESTOR_KEY: projects/t0-artifacts/locations/europe-west3/keyRings/attestors/cryptoKeys/liquidity-image-attestor/cryptoKeyVersions/1

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: bot-oci
            local_name: t0-liquidity
            image: t0-liquidity
          - package: dashboard-oci
            local_name: t0-liquidity-dashboard
            image: t0-liquidity-dashboard
          - package: datasette-oci
            local_name: t0-liquidity-datasette
            image: t0-liquidity-datasette
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      # Same nix setup as ci.yaml, for the same reason its comment records:
      # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
      # (`cannot find flake 'flake:foundry'`); fixed in 2.30. v30 of this
      # action only shipped up to 2.26 — pin a working release.
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-oci-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-oci-${{ runner.os }}-
          gc-max-store-size-linux: 10G

      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
        with:
          # `container binauthz` lives in the beta component.
          install_components: beta

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build OCI image from the flake
        run: |
          set -euo pipefail
          nix build .#${{ matrix.package }}
          # streamLayeredImage output is a script that streams the tar.
          ./result | docker load
          docker tag "${{ matrix.local_name }}:latest" "${AR_REPO}/${{ matrix.image }}:${GITHUB_SHA}"

      - name: Push image and resolve digest
        id: push
        run: |
          set -euo pipefail
          docker push "${AR_REPO}/${{ matrix.image }}:${GITHUB_SHA}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${AR_REPO}/${{ matrix.image }}:${GITHUB_SHA}")
          echo "Pushed: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST##*@}" >> "$GITHUB_OUTPUT"

      # Two independent provenance proofs (bebop/oracle rationale): the
      # GitHub/Sigstore attestation is non-blocking (needs a paid plan on
      # private repos); the KMS/BinAuthz attestation below is the one the
      # VM's roll timer actually verifies and MUST succeed.
      - name: Attest build provenance (GitHub / Sigstore)
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.AR_REPO }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.sha256 }}

      # Nix image builds are reproducible, so a push that does not change an
      # image reproduces its digest, and sign-and-create 409s on the occurrence
      # that already exists for (attestor, digest). Tolerating that conflict is
      # sound: it means the attestation the VM's roll timer verifies is already
      # in place. Detected from the error text after the fact rather than by a
      # list-first guard because liquidity-deployer can attach occurrences to
      # the attestor note but lacks containeranalysis.notes.listOccurrences,
      # and a permission-denied list is indistinguishable from an empty one.
      - name: Sign Binary Authorization attestation
        run: |
          set -euo pipefail
          set +e
          output=$(gcloud beta container binauthz attestations sign-and-create \
            --project="t0-artifacts" \
            --artifact-url="${{ steps.push.outputs.digest }}" \
            --attestor="${ATTESTOR}" \
            --keyversion="${ATTESTOR_KEY}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$output" | grep -q "is the subject of a conflict"; then
              echo "Attestation already exists for ${{ steps.push.outputs.digest }}; skipping"
              exit 0
            fi
            exit "$status"
          fi

  # STAGING ROLLS ON EVERY MASTER MERGE — the same fast path pricing, bebop and
  # the oracle have. Those planes are Cloud Run, so their deploy is a `gcloud
  # run deploy`; this one is a GCE VM (exclusive-writer SQLite), so the deploy
  # is a write to the images.env object the VM's roll timer polls every 2
  # minutes. The box then verifies the liquidity-image attestation of every
  # digest before it adopts anything, so this job cannot make it run an
  # unsigned image — the provenance gate is on the consumer, not here.
  #
  # What this job may touch is exactly one object: the IAM grant behind
  # DEPLOYER_SA is objectAdmin conditioned to
  # gs://t0-liquidity-staging-config/images.env (t0.devops
  # terraform/staging-liquidity). It rewrites the three first-party digest
  # lines in place and preserves every other line byte for byte — in
  # particular GATED_SERVICE_REPLICAS, the workload gate, which is
  # Terraform's and must never be settable from this repo. Terraform reads
  # the digests back on every plan (images.yaml `ci_rolls: true`), so an
  # apply recomposes what this job wrote instead of undoing it.
  #
  # PRODUCTION IS NOT DEPLOYED FROM THIS REPO: promote a staging-proven digest
  # into t0.devops terraform/production-liquidity/images.yaml and merge (PAM
  # -gated apply). This SA holds nothing in the production project.
  roll-staging:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CONFIG_BUCKET: t0-liquidity-staging-config
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2

      - name: Rewrite images.env with the digests just built
        id: roll
        run: |
          set -euo pipefail

          # Resolve digests from the tag this run pushed rather than passing
          # them out of the matrix (matrix jobs share one `outputs` map, so
          # the last leg to finish would win).
          resolve() {
            gcloud artifacts docker images describe "${AR_REPO}/$1:${GITHUB_SHA}" \
              --format='value(image_summary.digest)'
          }

          # Generation captured BEFORE the read so the precondition on the
          # write spans the whole read-modify-write: a concurrent writer
          # (a t0.devops apply) between our read and our cp fails the cp
          # itself instead of being detected only by the read-back below.
          GENERATION=$(gcloud storage objects describe \
            "gs://${CONFIG_BUCKET}/images.env" --format='value(generation)')
          gcloud storage cat "gs://${CONFIG_BUCKET}/images.env" > current.env
          cp current.env next.env

          # Refuse to write a file that is missing anything: a dropped
          # GATED_SERVICE_REPLICAS makes the VM's `compose --scale bot=` fail
          # with `strconv.Atoi: invalid syntax` and takes the whole stack unit
          # down, and an empty image ref fails `compose pull` on the box.
          for key in BOT_IMAGE DASHBOARD_IMAGE DATASETTE_IMAGE EXPORTER_IMAGE GATED_SERVICE_REPLICAS; do
            grep -q "^${key}=" current.env \
              || { echo "::error::images.env has no ${key} — refusing to write"; exit 1; }
          done

          for pair in t0-liquidity:BOT_IMAGE \
                      t0-liquidity-dashboard:DASHBOARD_IMAGE \
                      t0-liquidity-datasette:DATASETTE_IMAGE; do
            image="${pair%%:*}"
            key="${pair##*:}"
            digest="$(resolve "$image")"
            case "$digest" in
              sha256:[0-9a-f]*) ;;
              *) echo "::error::could not resolve a digest for ${image}:${GITHUB_SHA} (got '${digest}')"; exit 1 ;;
            esac
            sed -i "s|^${key}=.*|${key}=${AR_REPO}/${image}@${digest}|" next.env
          done

          echo "--- images.env ---"
          cat next.env

          # Outputs are emitted on EVERY path, early-exit included: the
          # adoption wait below runs regardless of who wrote the digests,
          # so a re-run after a failed roll re-verifies instead of going
          # green over a box still running the old images (review catch,
          # #1284).
          grep -q '^GATED_SERVICE_REPLICAS=0$' next.env \
            && echo "gated=true" >> "$GITHUB_OUTPUT" \
            || echo "gated=false" >> "$GITHUB_OUTPUT"
          # ALL THREE first-party lines, not just the bot: Nix builds are
          # reproducible, so a dashboard-only merge leaves BOT_IMAGE
          # identical to the previous roll — matching one line would go
          # green while the box still runs the old dashboard (review
          # catch, ueco-jb).
          echo "bot=$(grep '^BOT_IMAGE=' next.env)" >> "$GITHUB_OUTPUT"
          echo "dashboard=$(grep '^DASHBOARD_IMAGE=' next.env)" >> "$GITHUB_OUTPUT"
          echo "datasette=$(grep '^DATASETTE_IMAGE=' next.env)" >> "$GITHUB_OUTPUT"

          if cmp -s current.env next.env; then
            echo "::notice::images.env already carries these digests — verifying adoption only"
            echo "rolled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gcloud storage cp --if-generation-match="$GENERATION" \
            next.env "gs://${CONFIG_BUCKET}/images.env" || {
            echo "::error::images.env changed under us (a concurrent t0.devops apply?) — re-run this job"
            exit 1
          }

          # Read back: Terraform writes this object too (on a t0.devops merge),
          # and a plan taken before this push would apply older digests. Losing
          # that race must be a red job, not a box that quietly rolls backwards.
          gcloud storage cat "gs://${CONFIG_BUCKET}/images.env" > readback.env
          cmp -s next.env readback.env || {
            echo "::error::images.env was overwritten by another writer (a concurrent t0.devops apply?) — re-run this job"
            diff -u next.env readback.env || true
            exit 1
          }

          echo "rolled=true" >> "$GITHUB_OUTPUT"

      # The roll is only real once the box has taken it. The timer publishes
      # deployed.env after a SUCCESSFUL stack restart, so this turns a refused
      # attestation or a crash-looping image into a failed deploy here instead
      # of a green build over a box still running the old digests. Skipped when
      # the workload is gated off (nothing runs, so nothing is published).
      # Gated on `gated` ALONE, not on `rolled`: after a failed roll the
      # digests are already in images.env, so a re-run's write is a no-op —
      # the verification must still happen or the re-run goes green over a
      # box running the old images. A genuine no-op merge passes on the
      # first poll, so this costs nothing (review catch, #1284).
      - name: Wait for the VM to adopt it
        if: steps.roll.outputs.gated == 'false'
        run: |
          set -euo pipefail
          wants=("${{ steps.roll.outputs.bot }}" \
                 "${{ steps.roll.outputs.dashboard }}" \
                 "${{ steps.roll.outputs.datasette }}")
          for _ in $(seq 1 40); do
            # A permission failure must not look like "not adopted yet"
            # (review catch: the deployer SA's grant is conditioned per
            # object, and a missing deployed.env read grant would burn the
            # full timeout pointing at the roll timer). Branch on the exit
            # status: only a successful read may be inspected; a denied
            # read fails loudly at the FIRST poll.
            if out=$(gcloud storage cat "gs://${CONFIG_BUCKET}/deployed.env" 2>&1); then
              adopted=true
              for want in "${wants[@]}"; do
                grep -qxF "$want" <<<"$out" || { adopted=false; break; }
              done
              if $adopted; then
                echo "::notice::t0-liquidity-staging rolled to ${GITHUB_SHA}"
                exit 0
              fi
            elif grep -qiE "403|permission|denied" <<<"$out"; then
              echo "::error::cannot READ deployed.env — the deployer SA lacks the read grant (t0.devops staging-liquidity):"
              echo "$out"
              exit 1
            fi
            sleep 15
          done
          echo "::error::the VM has not published this digest after 10 minutes." \
            "Check the roll timer: gcloud compute ssh t0-liquidity-staging --project t0-liquidity-staging" \
            "--zone europe-west3-b --tunnel-through-iap --command 'journalctl -u t0-liquidity-staging-roll -n 50'"
          exit 1
