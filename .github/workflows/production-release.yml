name: production-release

# THE production release for this repo, and the only way to roll it. One
# manual action plus the app-deploy PAM approval in t0-liquidity:
#   Actions -> production-release -> Run workflow
#     version = vX.Y.Z  : images AND config/prod/st0x-hedge.toml from that
#                         tag (new version, re-deploy or rollback);
#     version empty     : CONFIG-ONLY release, config/prod/st0x-hedge.toml
#                         from master on the digests LIVE in production.
# Nothing fires on its own any more (until 2026-09-08 a merge touching the
# prod config requested a grant by itself, and release-tag.yml did the same
# for every tag; RAI-2266). Either way the file is validated inside the
# exact bot image it will run on before the grant is requested, published
# as a liquidity-runtime-config version, and images.env is rewritten with
# the digests + CONFIG_VERSION once an approver activates the grant; the VM
# verifies attestations, restarts the stack and publishes deployed.env,
# which the job waits for.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "vX.Y.Z to deploy images and config from that tag; leave empty for a config-only release of config/prod/st0x-hedge.toml from master onto the live images"
        required: false
        default: ""
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@986523b8a550aefc41e34ba35320da74d2e5d784  # app-release @ .github main
    with:
      environment: production
      runtime: bot-vm
      project: t0-liquidity
      config_bucket: t0-liquidity-config
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-liquidity
      images: t0-liquidity=BOT_IMAGE t0-liquidity-dashboard=DASHBOARD_IMAGE t0-liquidity-datasette=DATASETTE_IMAGE
      attestor: projects/t0-artifacts/attestors/liquidity-image
      service_account: liquidity-releaser@t0-artifacts.iam.gserviceaccount.com
      pam_entitlement: app-deploy
      image_tag: ${{ inputs.version || '' }}
      ref: ${{ inputs.version || '' }}
      config_file: config/prod/st0x-hedge.toml
      config_secret: liquidity-runtime-config
      validate_entrypoint: /bin/validate-config
      validate_command: --config /candidate.toml
