name: pre-close-cutoff

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Test the close-window guard
        run: python3 -m unittest discover -s scripts -p test_pre_close_cutoff.py
      - name: Check deployed close-window settings
        run: python3 scripts/check_pre_close_cutoff.py

