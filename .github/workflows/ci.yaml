          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      # The sticky disk key embeds a hash of a repository secret. The `commit`
      # input below is part of the workflow file, which a pull request can
      # edit, so it cannot stop a fork from committing a snapshot. A fork run
      # gets no secrets, so it cannot name this disk, and it skips the disk
      # and builds cold. Same-repository runs have the secret, but they can
      # already push to Cachix with it, so the trust level does not change.
      # The mask keeps the derived key out of the public logs.
      - name: Derive persistent target disk key
        id: target-disk
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        env:
          DISK_KEY_SECRET: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$DISK_KEY_SECRET" ]; then
            echo "CACHIX_AUTH_TOKEN is not set, so the target disk key cannot be derived" >&2
            exit 1
          fi
          key=$(printf 'st0x-target-disk:%s' "$DISK_KEY_SECRET" | sha256sum | cut -c1-32)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The target directory lives on a Blacksmith sticky disk: each run
      # mounts the last snapshot. Only master pushes (reviewed, merged code)
      # save the disk that pull request and master runs use, so pull request
      # runs never replace it. Manual dispatches use and save their own
      # `-dispatch` disk, which no other run reads, so a branch can measure
      # cache changes without touching the master disk. The next step makes
      # only changed sources newer than the snapshot's build. Registry and git
      # dependencies fingerprint by version and stay built.
      - name: Mount persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26  # v1.7.2
        with:
          key: ${{ steps.target-disk.outputs.key }}-target-docs-v1${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
          path: ${{ github.workspace }}/target/docs
          commit: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

      # A fresh disk mounts root-owned. A saving run clears the disk once it
      # holds more than 40 GiB (one full build is about 7), since stale
      # artifacts from older toolchains and dependency versions are never
      # collected. The fresh ext4 volume also holds a root-owned lost+found
      # (mode 700) that the runner user cannot remove, so the wipe runs with
      # sudo and keeps it. The snapshot records the git content hashes of the
      # tree it compiled; sync-source-mtimes.sh then makes only the sources
      # whose content differs newer than that build, so cargo reruns rustc
      # just for the crates they belong to. A changed lockfile, manifest,
      # toolchain, Nix file, or migration makes every source newer instead.
      - name: Prepare persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        run: |
          sudo chown "$(id -u):$(id -g)" "$CARGO_TARGET_DIR"
          used=$(df --output=used -BG "$CARGO_TARGET_DIR" | tail -1 | tr -dc '0-9')
          echo "target disk holds ${used} GiB"
          if [ "${{ github.event_name }}" != pull_request ] && [ "$used" -gt 40 ]; then
            sudo find "$CARGO_TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
          fi
          ./scripts/sync-source-mtimes.sh prepare

      # rain-math-float is upstream source nix materializes under .tmp/, so it
      # is a workspace member we do not own; exclude it rather than gate CI on
      # its rustdoc warnings.
      - name: Docs
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            ./scripts/clean-stale-rain-math-float.sh
            cargo doc --workspace --no-deps --all-features --exclude rain-math-float
            ./scripts/sync-source-mtimes.sh record
          "

  # The shards start with the run instead of after their build job: they
  # install Nix and realize the dev shell while the archive compiles, then wait
  # for their build job (backend-build-e2e for the e2e shards, backend-build for
  # the unit shards) through the read-only Actions API and fail if it does not
  # succeed. That moves ~35 s of setup per shard off the critical path.
  backend-test:
    name: backend test ${{ matrix.suite }} ${{ matrix.partition }} of ${{ matrix.suite == 'e2e' && 8 || 4 }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Covers the wait for the build job (itself up to 30 minutes) as well as
    # the archive restore and the tests.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false

      # Eight e2e shards start on the e2e archive; four shards run every other
      # test from the full archive.
      matrix:
        suite: [e2e, unit]
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - suite: unit
            partition: 5
          - suite: unit
            partition: 6
          - suite: unit
            partition: 7
          - suite: unit
            partition: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Realize the backend dev shell
        run: nix develop .#ci-backend -c true

      # wait-for-job.sh polls with conditional requests, so twelve shards per
      # run stay well inside the GITHUB_TOKEN rate limit, and fails the shard
      # unless its build job succeeded.
      - name: Wait for backend build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/wait-for-job.sh "${{ matrix.suite == 'e2e' && 'backend build e2e' || 'backend build' }}"

      # A re-run of only the failed shards has a new run_attempt, while the
      # archive belongs to the attempt whose build job succeeded.
      - name: Restore nextest archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/nextest-${{ matrix.suite == 'e2e' && 'e2e-' || '' }}archive.tar.zst
          key: ${{ runner.os }}-nextest-${{ matrix.suite == 'e2e' && 'e2e-' || '' }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-nextest-${{ matrix.suite == 'e2e' && 'e2e-' || '' }}${{ github.run_id }}-
          fail-on-cache-miss: true

      # Test binaries come from the shard's build job archive; no recompile.
      # count: deals each binary's tests round-robin, so every shard gets an
      # even share of the slow e2e tests (hash: left one shard with most).
      - name: test ${{ matrix.suite }} ${{ matrix.partition }}
        env:
          ARCHIVE: ${{ runner.temp }}/nextest-${{ matrix.suite == 'e2e' && 'e2e-' || '' }}archive.tar.zst
          SUITE_FILTER: ${{ matrix.suite == 'e2e' && 'binary(=e2e)' || 'not binary(=e2e)' }}
          PARTITION: count:${{ matrix.partition }}/${{ matrix.suite == 'e2e' && 8 || 4 }}
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            cargo nextest run --archive-file \"\$ARCHIVE\" \
              --workspace-remap . --profile ci \
              -E \"\$SUITE_FILTER\" --partition \"\$PARTITION\"
          "

  backend:
    name: backend
    needs: [backend-build, backend-build-e2e, backend-lint, backend-docs, backend-test]
    # Inspect every dependency state, including failures, skips, and
    # cancellations, so this required check cannot pass without validation.
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check backend validation
        run: |
          if [ "${{ needs.backend-build.result }}" != "success" ] || [ "${{ needs.backend-build-e2e.result }}" != "success" ] || [ "${{ needs.backend-lint.result }}" != "success" ] || [ "${{ needs.backend-docs.result }}" != "success" ] || [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "backend validation failed (build=${{ needs.backend-build.result }}, build-e2e=${{ needs.backend-build-e2e.result }}, lint=${{ needs.backend-lint.result }}, docs=${{ needs.backend-docs.result }}, test=${{ needs.backend-test.result }})"
            exit 1
          fi

  # Cancellable dashboard work: the dashboard image's nginx config, the
  # Grafana board's script tests, and the Turnkey message utility. The
  # separate required gate below inspects this result, so cancellation cannot
  # turn the required check green while an obsolete run still consumes a
  # runner.
  dashboard-tests:
    name: dashboard tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Dashboard proxy config
        run: nix build .#dashboard-nginx-check

      - name: Board script tests
        working-directory: observability/tests
        run: |
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun install --frozen-lockfile
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run test
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run typecheck
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run format:check

      - name: Turnkey message utility
        working-directory: scripts/turnkey-message
        run: |
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun install --frozen-lockfile
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun test
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run typecheck
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run format:check

  # Required dashboard check. Every dependency state other than success,
  # including skips and cancellation, fails closed.
  dashboard:
    name: dashboard
    needs: dashboard-tests
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check dashboard validation
        run: |
          if [ "${{ needs.dashboard-tests.result }}" != "success" ]; then
            echo "dashboard validation failed (tests=${{ needs.dashboard-tests.result }})"
            exit 1
          fi

  # Cancellable hooks work. Pre-commit is the only check that validates docs
  # files (deno fmt covers markdown).
  hooks-run:
    name: hooks validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: fork pull request CI invariants
        run: ./scripts/test-fork-pr-ci.sh

      - name: rain-math-float stale-artifact cleanup invariants
        run: ./scripts/test-clean-stale-rain-math-float.sh

      - name: source mtime sync invariants
        run: ./scripts/test-sync-source-mtimes.sh

      - name: rustc parallel frontend wrapper invariants
        run: ./scripts/test-rustc-parallel-frontend.sh

      - name: clippy CI wrapper invariants
        run: ./scripts/test-clippy-ci.sh

      - name: CI job wait invariants
        run: ./scripts/test-wait-for-job.sh

      - name: tailscale certificate renewal invariants
        run: nix develop .#ci-hooks -c nu scripts/validate-tailscale-cert-renewal.nu

      - name: identity cleanup invariants
        run: nix build --no-link .#checks.x86_64-linux.parse-identity-cleanup

      - name: pre-commit hooks
        run: nix develop .#ci-hooks -c pre-commit run --all-files

      - name: Audit Rust dependencies
        run: nix develop .#ci-audit -c bash -c './scripts/test-rust-audit.sh && ./scripts/audit-rust.sh'

  # Required hooks check. Inspect the work result even when it was skipped or
  # canceled, so branch protection never accepts an unvalidated commit.
  hooks:
    name: hooks
    needs: hooks-run
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check hooks validation
        run: |
          if [ "${{ needs.hooks-run.result }}" != "success" ]; then
            echo "hooks validation failed (result=${{ needs.hooks-run.result }})"
            exit 1
          fi
