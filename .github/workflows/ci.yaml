            ./scripts/sync-source-mtimes.sh record
          "

  # rustdoc runs in its own job on its own disk. After clippy in one job it
  # added 1m17 to the lint path on a cold disk; beside clippy in that job, with
  # a second target directory, it compiled every dependency again on the same
  # cores and took 4m39.
  backend-docs:
    name: backend docs
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "1"
