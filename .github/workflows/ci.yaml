name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Pull request events for the same merge ref share a group. A later head, base,
# title, or body update may replace an older run, but every replacement performs
# the same validation, so cancellation cannot leave behind a green no-op run.
# Master keeps one group per SHA so independent post-merge runs do not cancel.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || ''}}
  cancel-in-progress: true

# CI validates untrusted pull request code, so its repository access stays
# read-only at the workflow level.
permissions:
  contents: read
  pull-requests: read

env:
  # GitHub holds fork pull_request runs for maintainer approval, removes every
  # repository secret, and limits GITHUB_TOKEN to read access. Dependabot runs
  # have the same restrictions despite using a branch in this repository. Keep
  # an explicit flag as well, so no authenticated cache publisher is invoked
  # for untrusted code.
  UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') }}

# Nix is installed via nix-quick-install-action and both the shared
# `rainlanguage` Cachix (cachix-action) and the per-runner nix store
# (cache-nix-action) are warmed before any `nix` invocation. This replaces the
# old DeterminateSystems installer + magic-nix-cache + custom ABI-prefetch job,
# which did not share the `rainlanguage` cache that raindex CI populates.

jobs:
  # Classifies the push: `code == 'true'` when at least one changed file is
  # NOT a docs file. With `predicate-quantifier: every`, a file matches the
  # `code` filter only if it matches `**` AND every negated docs glob -- i.e.
  # it is a non-docs file. A push that mixes code and docs therefore flips
  # `code` to true and runs full CI (fail-closed); only a confirmed
  # all-docs push yields `code == 'false'`. If this job errors or is
  # skipped, `code` is empty/unknown and the gates require the real checks.
  #
  # NOTE: paths-filter uses the Pull Requests API for pull_request runs and git
  # change detection for push/workflow_dispatch, so the checkout is needed for
  # the latter two events.
  changes:
    name: changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # GitHub's pull request files API returns at most 3,000 files. At that
      # limit the filter may have received a truncated list, so fail into full
      # CI instead of accepting a possible docs-only false negative.
      code: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 3000 && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        if: ${{ github.event_name != 'pull_request' }}
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!AGENTS.md'
              - '!README*'

  backend-build:
    name: backend build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          prefix-key: rust-${{ github.workflow }}
          workspaces: ". -> target/test"
          save-if: ${{ env.UNTRUSTED_PR != 'true' }}

      # Build the test binaries once into a nextest archive shared by all four
      # partitions, and run clippy and rustdoc here since this is the single
      # full compile.
      - name: Build nextest archive, run clippy and docs
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            cargo nextest archive --workspace --all-features --profile ci \
              --archive-file \"\$RUNNER_TEMP/nextest-archive.tar.zst\"
            cargo clippy --workspace --all-targets --all-features
            # rain-math-float is upstream source nix materializes under .tmp/,
            # so it is a workspace member we do not own; exclude it rather than
            # gate CI on its rustdoc warnings.
            cargo doc --workspace --no-deps --all-features --exclude rain-math-float
            # compile_fail_tests (trybuild) shells out to cargo at run time, so
            # run it here where the workspace build cache is warm. The archive
            # partitions only carry prebuilt binaries and would compile it cold.
            cargo nextest run --workspace --all-features --profile ci \
              -E 'test(compile_fail_tests)'
          "

      # Blacksmith transparently redirects the native Actions cache to
      # colocated storage. GitHub artifacts still use remote Azure storage,
      # which made each test shard spend ~20 minutes downloading this file.
      - name: Save nextest archive
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          key: ${{ runner.os }}-nextest-${{ github.run_id }}-${{ github.run_attempt }}

  backend-test:
    name: backend test ${{ matrix.partition }} of 4
    needs: [changes, backend-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false

      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Restore nextest archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          key: ${{ runner.os }}-nextest-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      # Test binaries come from the archive built in backend-build; no recompile.
      - name: test ${{ matrix.partition }} of 4
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            cargo nextest run --archive-file \"\$RUNNER_TEMP/nextest-archive.tar.zst\" \
              --workspace-remap . --profile ci \
              -E 'not test(compile_fail_tests)' \
              --partition hash:${{ matrix.partition }}/4
          "

  backend:
    name: backend
    needs: [changes, backend-build, backend-test]
    # Inspect every dependency state, including failures, skips, and
    # cancellations, so this required check cannot pass without validation.
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check backend validation
        run: |
          # Skip backend validation ONLY for a confirmed docs-only push: the
          # changes job succeeded AND found no code files (code == 'false').
          # Any other state -- changes failed/skipped, or code present -- falls
          # through and requires the real jobs (which were skipped on a
          # non-code path), so this gate fails closed rather than
          # green-lighting untested code.
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change - backend validation not required."
            exit 0
          fi
          if [ "${{ needs.backend-build.result }}" != "success" ] || [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "backend validation failed (build=${{ needs.backend-build.result }}, test=${{ needs.backend-test.result }})"
            exit 1
          fi

  # Cancellable dashboard work. The separate required gate below inspects this
  # result, so cancellation cannot turn the required check green while an
  # obsolete build still consumes a runner.
  dashboard-build:
    name: dashboard build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Check bun.nix is up to date
        run: |
          nix run .#genBunNix
          nix fmt -- dashboard/bun.nix
          git diff --exit-code dashboard/bun.nix

      - name: Generate dashboard API bindings
        run: nix run .#st0x-dto -- dashboard/src/lib/api

      - name: Dashboard lint
        working-directory: dashboard
        run: |
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun install --frozen-lockfile
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run lint

      - name: Dashboard
        run: nix build .#st0x-dashboard

  # Required dashboard check. A confirmed docs-only change may skip the real
  # build. Every other dependency state, including cancellation, fails closed.
  dashboard:
    name: dashboard
    needs: [changes, dashboard-build]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check dashboard validation
        run: |
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change - dashboard validation not required."
            exit 0
          fi
          if [ "${{ needs.dashboard-build.result }}" != "success" ]; then
            echo "dashboard validation failed (build=${{ needs.dashboard-build.result }})"
            exit 1
          fi

  # Cancellable hooks work. It runs on docs-only changes because pre-commit is
  # the only check that validates docs files (deno fmt covers markdown).
  hooks-run:
    name: hooks validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: fork pull request CI invariants
        run: ./scripts/test-fork-pr-ci.sh

      - name: deploy migration invariants
        run: ./scripts/validate-deploy-migration.sh

      - name: tailscale certificate renewal invariants
        run: nix develop .#ci-hooks -c nu scripts/validate-tailscale-cert-renewal.nu

      - name: identity cleanup invariants
        run: nix build --no-link .#checks.x86_64-linux.parse-identity-cleanup

      - name: pre-commit hooks
        run: nix develop .#ci-hooks -c pre-commit run --all-files

  # Required hooks check. Inspect the work result even when it was skipped or
  # canceled, so branch protection never accepts an unvalidated commit.
  hooks:
    name: hooks
    needs: hooks-run
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check hooks validation
        run: |
          if [ "${{ needs.hooks-run.result }}" != "success" ]; then
            echo "hooks validation failed (result=${{ needs.hooks-run.result }})"
            exit 1
          fi
