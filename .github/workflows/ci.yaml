name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Pull request events for the same merge ref share a group. A later push,
# reopen, or ready-for-review event may replace an older run, but every
# replacement performs the same validation, so cancellation cannot leave behind
# a green no-op run. `edited` is not subscribed because title and body edits
# change no code; docs/ci.md explains how base retargets are still validated.
# Master keeps one group per SHA so independent post-merge runs do not cancel.
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || ''}}
  cancel-in-progress: true

# CI validates untrusted pull request code, so its repository access stays
# read-only at the workflow level.
permissions:
  contents: read
  pull-requests: read

env:
  # GitHub holds fork pull_request runs for maintainer approval, removes every
  # repository secret, and limits GITHUB_TOKEN to read access. Dependabot runs
  # have the same restrictions despite using a branch in this repository. Keep
  # an explicit flag as well, so no authenticated cache publisher is invoked
  # for untrusted code.
  UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') }}

# Nix is installed via nix-quick-install-action and both the shared
# `rainlanguage` Cachix (cachix-action) and the per-runner nix store
# (cache-nix-action) are warmed before any `nix` invocation. This replaces the
# old DeterminateSystems installer + magic-nix-cache + custom ABI-prefetch job,
# which did not share the `rainlanguage` cache that raindex CI populates.

jobs:
  # Classifies the push: `code == 'true'` when at least one changed file is
  # NOT a docs file. With `predicate-quantifier: every`, a file matches the
  # `code` filter only if it matches `**` AND every negated docs glob -- i.e.
  # it is a non-docs file. A push that mixes code and docs therefore flips
  # `code` to true and runs full CI (fail-closed); only a confirmed
  # all-docs push yields `code == 'false'`. If this job errors or is
  # skipped, `code` is empty/unknown and the gates require the real checks.
  #
  # NOTE: paths-filter uses the Pull Requests API for pull_request runs and git
  # change detection for push/workflow_dispatch, so the checkout is needed for
  # the latter two events.
  changes:
    name: changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # GitHub's pull request files API returns at most 3,000 files. At that
      # limit the filter may have received a truncated list, so fail into full
      # CI instead of accepting a possible docs-only false negative.
      code: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files >= 3000 && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        if: ${{ github.event_name != 'pull_request' }}
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590  # v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!AGENTS.md'
              - '!README*'

  backend-build:
    name: backend build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # The target directory persists on a sticky disk (below), so rustc's
      # incremental state carries over between runs.
      CARGO_INCREMENTAL: "1"
      CARGO_TARGET_DIR: target/test
      # Registry and git sources live on the same sticky disk. Swatinem's
      # rust-cache is not used here: its save step prunes workspace-crate and
      # incremental artifacts from the target directory before the disk
      # commits.
      CARGO_HOME: ${{ github.workspace }}/target/test/cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      # The sticky disk key embeds a hash of a repository secret. The `commit`
      # input below is part of the workflow file, which a pull request can
      # edit, so it cannot stop a fork from committing a snapshot. A fork run
      # gets no secrets, so it cannot name this disk, and it skips the disk
      # and builds cold. Same-repository runs have the secret, but they can
      # already push to Cachix with it, so the trust level does not change.
      # The mask keeps the derived key out of the public logs.
      - name: Derive persistent target disk key
        id: target-disk
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        env:
          DISK_KEY_SECRET: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$DISK_KEY_SECRET" ]; then
            echo "CACHIX_AUTH_TOKEN is not set, so the target disk key cannot be derived" >&2
            exit 1
          fi
          key=$(printf 'st0x-target-disk:%s' "$DISK_KEY_SECRET" | sha256sum | cut -c1-32)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The target directory lives on a Blacksmith sticky disk: each run
      # mounts the last snapshot. Only master pushes (reviewed, merged code)
      # save a new one, so pull request runs and manual dispatches never
      # replace it. The next step makes every tracked source newer than the
      # snapshot, so cargo reruns rustc for each workspace crate, and rustc's
      # incremental cache reuses only results whose source hashes still match.
      # Registry and git dependencies fingerprint by version and stay built.
      - name: Mount persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26  # v1.7.2
        with:
          key: ${{ steps.target-disk.outputs.key }}-target-test-v1
          path: ${{ github.workspace }}/target/test
          commit: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      # A fresh disk mounts root-owned. A saving run clears the disk once it
      # holds more than 40 GiB (one full build is about 7), since stale
      # artifacts from older toolchains and dependency versions are never
      # collected. The fresh ext4 volume also holds a root-owned lost+found
      # (mode 700) that the runner user cannot remove, so the wipe runs with
      # sudo and keeps it. The snapshot keeps its file mtimes, and a master
      # run may have saved it after this job's checkout, so touching every
      # tracked source after the mount stops cargo from treating a changed
      # crate as fresh.
      - name: Prepare persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        run: |
          git ls-files -z | xargs -0 touch -h
          sudo chown "$(id -u):$(id -g)" "$CARGO_TARGET_DIR"
          used=$(df --output=used -BG "$CARGO_TARGET_DIR" | tail -1 | tr -dc '0-9')
          echo "target disk holds ${used} GiB"
          if [ "${{ github.event_name }}" = push ] && [ "$used" -gt 40 ]; then
            sudo find "$CARGO_TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
          fi

      # Build the test binaries once into a nextest archive shared by all four
      # partitions. Clippy and rustdoc run in backend-lint, so the test shards
      # wait only for this compile.
      - name: Build nextest archive
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            ./scripts/clean-stale-rain-math-float.sh
            cargo nextest archive --workspace --all-features --profile ci \
              --archive-file \"\$RUNNER_TEMP/nextest-archive.tar.zst\"
          "

      # Blacksmith transparently redirects the native Actions cache to
      # colocated storage. GitHub artifacts still use remote Azure storage,
      # which made each test shard spend ~20 minutes downloading this file.
      - name: Save nextest archive
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          key: ${{ runner.os }}-nextest-${{ github.run_id }}-${{ github.run_attempt }}

  # Clippy, rustdoc, and the Python board checks need their own compile (clippy
  # cannot reuse test-profile artifacts), so they run beside backend-build
  # instead of after it, off the test shards' critical path.
  backend-lint:
    name: backend lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "1"
      CARGO_TARGET_DIR: target/lint
      # Registry and git sources live on the same sticky disk. Swatinem's
      # rust-cache is not used here: its save step prunes workspace-crate and
      # incremental artifacts from the target directory before the disk
      # commits.
      CARGO_HOME: ${{ github.workspace }}/target/lint/cargo-home
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      # The sticky disk key embeds a hash of a repository secret. The `commit`
      # input below is part of the workflow file, which a pull request can
      # edit, so it cannot stop a fork from committing a snapshot. A fork run
      # gets no secrets, so it cannot name this disk, and it skips the disk
      # and builds cold. Same-repository runs have the secret, but they can
      # already push to Cachix with it, so the trust level does not change.
      # The mask keeps the derived key out of the public logs.
      - name: Derive persistent target disk key
        id: target-disk
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        env:
          DISK_KEY_SECRET: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$DISK_KEY_SECRET" ]; then
            echo "CACHIX_AUTH_TOKEN is not set, so the target disk key cannot be derived" >&2
            exit 1
          fi
          key=$(printf 'st0x-target-disk:%s' "$DISK_KEY_SECRET" | sha256sum | cut -c1-32)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The target directory lives on a Blacksmith sticky disk: each run
      # mounts the last snapshot. Only master pushes (reviewed, merged code)
      # save a new one, so pull request runs and manual dispatches never
      # replace it. The next step makes every tracked source newer than the
      # snapshot, so cargo reruns rustc for each workspace crate, and rustc's
      # incremental cache reuses only results whose source hashes still match.
      # Registry and git dependencies fingerprint by version and stay built.
      - name: Mount persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26  # v1.7.2
        with:
          key: ${{ steps.target-disk.outputs.key }}-target-lint-v1
          path: ${{ github.workspace }}/target/lint
          commit: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      # A fresh disk mounts root-owned. A saving run clears the disk once it
      # holds more than 40 GiB (one full build is about 7), since stale
      # artifacts from older toolchains and dependency versions are never
      # collected. The fresh ext4 volume also holds a root-owned lost+found
      # (mode 700) that the runner user cannot remove, so the wipe runs with
      # sudo and keeps it. The snapshot keeps its file mtimes, and a master
      # run may have saved it after this job's checkout, so touching every
      # tracked source after the mount stops cargo from treating a changed
      # crate as fresh.
      - name: Prepare persistent target directory
        if: ${{ env.UNTRUSTED_PR != 'true' }}
        run: |
          git ls-files -z | xargs -0 touch -h
          sudo chown "$(id -u):$(id -g)" "$CARGO_TARGET_DIR"
          used=$(df --output=used -BG "$CARGO_TARGET_DIR" | tail -1 | tr -dc '0-9')
          echo "target disk holds ${used} GiB"
          if [ "${{ github.event_name }}" = push ] && [ "$used" -gt 40 ]; then
            sudo find "$CARGO_TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name lost+found -exec rm -rf {} +
          fi

      # The board JSON must match its generator, with every liq_ selector
      # pinned to the exporter job; compare.py is the staging parity tool.
      - name: Board generator and liq-parity checks
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            python3 observability/gen-t0-liquidity.py --check
            python3 scripts/liq-parity/test_compare.py
          "

      - name: Clippy and docs
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            ./scripts/clean-stale-rain-math-float.sh
            cargo clippy --workspace --all-targets --all-features
            # rain-math-float is upstream source nix materializes under .tmp/,
            # so it is a workspace member we do not own; exclude it rather than
            # gate CI on its rustdoc warnings.
            cargo doc --workspace --no-deps --all-features --exclude rain-math-float
          "

  backend-test:
    name: backend test ${{ matrix.partition }} of 4
    needs: [changes, backend-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false

      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Restore nextest archive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          key: ${{ runner.os }}-nextest-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true

      # Test binaries come from the archive built in backend-build; no recompile.
      # count: deals each binary's tests round-robin, so every shard gets an
      # even share of the slow e2e tests (hash: left one shard with most).
      - name: test ${{ matrix.partition }} of 4
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            cargo nextest run --archive-file \"\$RUNNER_TEMP/nextest-archive.tar.zst\" \
              --workspace-remap . --profile ci \
              --partition count:${{ matrix.partition }}/4
          "

  backend:
    name: backend
    needs: [changes, backend-build, backend-lint, backend-test]
    # Inspect every dependency state, including failures, skips, and
    # cancellations, so this required check cannot pass without validation.
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check backend validation
        run: |
          # Skip backend validation ONLY for a confirmed docs-only push: the
          # changes job succeeded AND found no code files (code == 'false').
          # Any other state -- changes failed/skipped, or code present -- falls
          # through and requires the real jobs (which were skipped on a
          # non-code path), so this gate fails closed rather than
          # green-lighting untested code.
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change - backend validation not required."
            exit 0
          fi
          if [ "${{ needs.backend-build.result }}" != "success" ] || [ "${{ needs.backend-lint.result }}" != "success" ] || [ "${{ needs.backend-test.result }}" != "success" ]; then
            echo "backend validation failed (build=${{ needs.backend-build.result }}, lint=${{ needs.backend-lint.result }}, test=${{ needs.backend-test.result }})"
            exit 1
          fi

  # Cancellable dashboard work. The separate required gate below inspects this
  # result, so cancellation cannot turn the required check green while an
  # obsolete build still consumes a runner.
  dashboard-build:
    name: dashboard build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: Check bun.nix is up to date
        run: |
          nix run .#genBunNix
          nix fmt -- dashboard/bun.nix
          git diff --exit-code dashboard/bun.nix

      - name: Generate dashboard API bindings
        run: nix run .#st0x-dto -- dashboard/src/lib/api

      - name: Dashboard lint
        working-directory: dashboard
        run: |
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun install --frozen-lockfile
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run lint

      - name: Turnkey message utility
        working-directory: scripts/turnkey-message
        run: |
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun install --frozen-lockfile
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun test
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run typecheck
          nix develop "$GITHUB_WORKSPACE#ci-dashboard" -c bun run format:check

      - name: Dashboard
        run: nix build .#st0x-dashboard

  # Required dashboard check. A confirmed docs-only change may skip the real
  # build. Every other dependency state, including cancellation, fails closed.
  dashboard:
    name: dashboard
    needs: [changes, dashboard-build]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check dashboard validation
        run: |
          if [ "${{ needs.changes.result }}" = "success" ] && [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change - dashboard validation not required."
            exit 0
          fi
          if [ "${{ needs.dashboard-build.result }}" != "success" ]; then
            echo "dashboard validation failed (build=${{ needs.dashboard-build.result }})"
            exit 1
          fi

  # Cancellable hooks work. It runs on docs-only changes because pre-commit is
  # the only check that validates docs files (deno fmt covers markdown).
  hooks-run:
    name: hooks validation
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Configure Git fetch fail-fast
        run: |
          git config --global http.lowSpeedLimit 524288
          git config --global http.lowSpeedTime 60

      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035  # v34
        with:
          # Nix 2.24-2.28 fail to resolve rainix's overridden `foundry` input
          # (`cannot find flake 'flake:foundry'`); the fix landed in 2.30. v30
          # of this action only shipped up to 2.26, so use v34 and pin a
          # working release.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ env.UNTRUSTED_PR != 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.UNTRUSTED_PR == 'true' }}
          useDaemon: false

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          save: ${{ env.UNTRUSTED_PR != 'true' }}

      - name: fork pull request CI invariants
        run: ./scripts/test-fork-pr-ci.sh

      - name: rain-math-float stale-artifact cleanup invariants
        run: ./scripts/test-clean-stale-rain-math-float.sh

      - name: tailscale certificate renewal invariants
        run: nix develop .#ci-hooks -c nu scripts/validate-tailscale-cert-renewal.nu

      - name: identity cleanup invariants
        run: nix build --no-link .#checks.x86_64-linux.parse-identity-cleanup

      - name: pre-commit hooks
        run: nix develop .#ci-hooks -c pre-commit run --all-files

      - name: Audit Rust dependencies
        run: nix develop .#ci-audit -c bash -c './scripts/test-rust-audit.sh && ./scripts/audit-rust.sh'

  # Required hooks check. Inspect the work result even when it was skipped or
  # canceled, so branch protection never accepts an unvalidated commit.
  hooks:
    name: hooks
    needs: hooks-run
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Check hooks validation
        run: |
          if [ "${{ needs.hooks-run.result }}" != "success" ]; then
            echo "hooks validation failed (result=${{ needs.hooks-run.result }})"
            exit 1
          fi
