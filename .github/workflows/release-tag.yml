name: release-tag

# Promote-on-tag, the org-standard release flow (settled in
# st0x.liquidity#1289): pushing git tag vX.Y.Z labels the images master
# CI already built and attested for that commit, then cuts the GitHub
# release. It does not build and does not deploy. The full contract
# (refusals, idempotence, prerequisites) lives in the reusable workflow
# below; the identity is minted by t0.devops production-artifacts
# (modules/ar-labeler). Only the values in `with:` are this repo's own.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  label:
    permissions:
      id-token: write
      # write: release-label cuts the GitHub release for the tag.
      contents: write
    uses: ST0x-Technology/.github/.github/workflows/release-label.yml@abdcdba03715f9165c8562d8060a8e4c17ab7cc8  # release-label, bump via PR
    with:
      service_account: liquidity-labeler@t0-artifacts.iam.gserviceaccount.com
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-liquidity
      images: t0-liquidity t0-liquidity-dashboard t0-liquidity-datasette
      attestor: projects/t0-artifacts/attestors/liquidity-image

  # Production deploy of the version just labeled, behind the app-deploy PAM
  # grant in t0-liquidity: config/prod/st0x-hedge.toml at this tag is
  # validated inside the labeled bot image, published, and images.env is
  # rewritten (three digests + CONFIG_VERSION, SECRETS_VERSION untouched)
  # once an approver activates the grant; the VM then verifies attestations,
  # runs the migration + health gates and publishes deployed.env, which the
  # job waits for. Rollback = production-release.yml workflow_dispatch with
  # an older version.
  deploy-production:
    needs: label
    permissions:
      id-token: write
      contents: read
    uses: ST0x-Technology/.github/.github/workflows/app-release.yml@97500090e5c9c2d7e62226352071eeff0f2451b1  # app-release, bump via PR
    with:
      environment: production
      runtime: bot-vm
      project: t0-liquidity
      config_bucket: t0-liquidity-config
      ar_repo: europe-west3-docker.pkg.dev/t0-artifacts/t0-liquidity
      images: t0-liquidity=BOT_IMAGE t0-liquidity-dashboard=DASHBOARD_IMAGE t0-liquidity-datasette=DATASETTE_IMAGE
      attestor: projects/t0-artifacts/attestors/liquidity-image
      service_account: liquidity-releaser@t0-artifacts.iam.gserviceaccount.com
      pam_entitlement: app-deploy
      config_file: config/prod/st0x-hedge.toml
      config_secret: liquidity-runtime-config
      validate_entrypoint: /bin/validate-config
      validate_command: --config /candidate.toml
