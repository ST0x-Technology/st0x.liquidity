name: config-drift

# The runtime configs the deployed bots mount are config/staging/st0x-hedge.toml
# and config/prod/st0x-hedge.toml in THIS repo (since 2026-09-07; before
# that they lived in T0Trade/t0.devops and this job needed a cross-repo
# token). Two directions are guarded:
#   - this job: parse both files with THIS ref's schema (`validate-config`
#     without `--secrets`), so a schema change that would crash the
#     deployed bot on its current config fails the PR that introduces it;
#   - config-check.yml: parse both files with the newest RELEASED image's
#     validator, so a config change that only a not-yet-released binary
#     understands fails its PR. The release itself re-validates against the
#     exact digest it rolls (ST0x-Technology/.github app-release).
# A required new field therefore still lands tolerantly (optional or
# defaulted) first, then gets its config line, then tightens.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || ''}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: parse the deployed configs with this schema
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c  # v35
        with:
          # Same pin as ci.yaml: 2.24-2.28 cannot resolve rainix's foundry
          # input.
          nix_version: "2.31.2"
          nix_conf: |
            accept-flake-config = true
            fallback = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            keep-env-derivations = true
            keep-outputs = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        continue-on-error: true
        with:
          name: rainlanguage
          skipPush: true
          useDaemon: false

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          prefix-key: rust-${{ github.workflow }}

      - name: Parse both deployed configs with this schema
        run: |
          nix develop .#ci-backend -c bash -c "
            set -euxo pipefail
            cargo run --bin validate-config -- --config config/staging/st0x-hedge.toml
            cargo run --bin validate-config -- --config config/prod/st0x-hedge.toml
          "
