server_port = 8080
board_port = 8081
log_level = "debug"
# Console log output format: "text" (human readable, the default) or "json"
# (one JSON object per line, for log shippers reading journald).
log_format = "text"
# Log query link printed by CLI transfer commands, with "{id}" substituted.
# Author it together with the log shipper config that stamps the labels the
# query filters on. Omitted: no link is printed.
# log_query_url_template = "https://console.cloud.google.com/logs/query;query=jsonPayload.span.aggregate_id%3D%22{id}%22;project=example"
database_url = ":memory:"
apalis_finished_job_cleanup_interval_secs = 3600
# Consecutive offchain polls that must diverge from the inventory view's
# Hedging balance for a symbol before the poller escalates a forced snapshot
# reconciliation. Required; must be a positive integer.
inventory_divergence_threshold = 10
hedge_order_gate_reconciliation_timeout_secs = 10
# Live dashboard reference prices. The pricing service runs on the private
# network and authenticates the WebSocket with `[pricing].api_key` from secrets.
[pricing]
ws_url = "ws://st0x-pricing:8080/ws"

[telemetry]
service_name = "st0x-hedge"
# Deployment environment exported as the `deployment.environment` resource
# attribute (e.g. "production", "staging") so signals from different envs are
# distinguishable in VictoriaTraces/VictoriaLogs.
environment = "production"
# OTLP/HTTP endpoints for the self-hosted observability box (VictoriaTraces
# :10428, VictoriaLogs :9428), reached over Tailscale.
traces_endpoint = "http://100.x.x.x:10428"
logs_endpoint = "http://100.x.x.x:9428"

# Travel Rule info for Alpaca whitelist creation (required since 2026-03-27).
# Only needed when using Alpaca Broker API.
# Broker identity: which executor backs hedging. These are names and
# identifiers, not credentials, so they live here; only the legacy
# api_key/api_secret pair stays in the secrets file.
[broker]
type = "alpaca-broker-api"
mode = "sandbox"
account_id = "dddddddd-eeee-aaaa-dddd-beeeeeeeeeef"
# Keyless alternative (no stored credential anywhere): the bot signs RFC 7523
# client assertions with a Cloud KMS key whose public half is registered on a
# BrokerDash credential, and buys 15-minute bearer tokens. With this variant
# the secrets file needs no [broker] table at all. Requires
# roles/cloudkms.signerVerifier on the VM's service account.
# type = "alpaca-broker-api-kms"
# mode = "production"
# client_id = "CKEXAMPLE"
# kms_key_version = "projects/p/locations/l/keyRings/r/cryptoKeys/alpaca-api-key/cryptoKeyVersions/1"
counter_trade_slippage_bps = 100
extended_hours_reprice_timeout_secs = 300
close_flatten_reprice_timeout_secs = 60
extended_hours_close_flatten_window_secs = 900
# The cross for a close-flatten hedge ramps toward this ceiling by the 20:00 ET
# close, starting from counter_trade_slippage_bps at the start of the window.
# Placement prices off the broker's position mark, so this bounds how far it
# will chase a fill before a weekend or holiday (ADR 0019).
close_flatten_cross_max_bps = 400

[broker.travel_rule]
beneficiary_entity_name = "Acme Corp"
# Symbols intentionally removed from this table while registry or snapshot
# state still references them. Live workflows still block deployment. See
# "Retired Symbol" in docs/domain.md.
[assets.equities]
retired_symbols = []

[assets.equities.EXAMPLE]
extended_hours_counter_trading = "disabled"


[chains.base]
# How far along this chain is in its bring-up. Required; there is no default,
# because a chain silently reading as "active" would move funds the moment it
# was described.
#
#   disabled     -- not constructed at all: no RPC, no watcher, no signer.
#   observe-only -- the bot reads this chain; it places no orders and moves no
#                   funds. Refused on a chain whose assets have
#                   trading = "enabled", since those fills would be recorded
#                   and never hedged.
#   prefunded    -- the bot holds and moves funds here, but tops them up by
#                   hand; no rebalancing.
#   active       -- rebalancing runs too, subject to the per-asset flags.
#
# Startup refuses a state this build cannot serve, naming what is missing:
# a chain with no fill watcher cannot trade, and one whose gas token is not
# ETH cannot be "active" until a price source for it exists.
lifecycle = "active"
# Block-confirmation depth required before a transaction this bot submits is
# treated as settled (the primary gate for USDC rebalancing withdrawals). This
# does NOT govern order-fill ingestion: the fill monitor caps the backfill range
# at the configured ingestion_cutoff block, not this depth. Set explicitly per
# chain based on observed confirmation behavior.
required_confirmations = 3

[chains.base.trading]
orderbook = "0x1111111111111111111111111111111111111111"
# Rebalancing settlement mode. "legacy" settles directly against the orderbook
# with bot-EOA-owned vaults and omits the `inventory` field below; "managed"
# settles through the shared RaindexInventory named by `inventory`. Explicit (no
# default): "managed" without an `inventory`, or "legacy" with one, fails at
# startup.
inventory_mode = "managed"
# Public OPERATOR_ROLE holders whose inventory settlements should be attributed
# to a named venue. These are deployment-specific and must be updated when an
# adapter rotates or is redeployed.
inventory_adapters = [
  { venue = "bebop", operator = "0x4444444444444444444444444444444444444444" },
  { venue = "uniswap_v4", operator = "0x5555555555555555555555555555555555555555" },
]
# Shared RaindexInventory (rainlanguage/raindex.governance) that owns the
# Raindex orders/vaults. REQUIRED when inventory_mode = "managed" (and forbidden
# for "legacy"). Rebalance deposits/withdrawals settle through this contract;
# fills across every venue adapter (Bebop hook, univ4 hook) surface here as
# OperatorDeposit/OperatorWithdraw events. The bot's EOA must hold OPERATOR_ROLE
# on this address for rebalancing to succeed (a startup preflight checks this
# and refuses to start otherwise).
inventory = "0x6b7B523fADd1677413AD92c9404C8F0796bACF6F"
# REQUIRED. Owner of the Raindex orders/vaults on-chain -- scopes every
# vaultBalance2 read, vault-registry entry, and ClearV3/TakeOrderV3 order-owner
# fill match. No fallback: this determines fund routing, so it must be explicit
# and a missing value fails startup. While the vaults are owned by the bot EOA
# (the pre-inventory-migration state, i.e. inventory_mode = "legacy"), set it to
# the [wallet].address value. Once the vaults are migrated under the inventory
# contract, `msg.sender` to Raindex is the inventory, so it becomes the vault
# owner: under inventory_mode = "managed" this must equal `inventory` above, as
# it does here.
vault_owner = "0x6b7B523fADd1677413AD92c9404C8F0796bACF6F"
deployment_block = 1
# Block tag used as the fill-ingestion cutoff. REQUIRED -- must be set
# explicitly to "safe" or "finalized"; omitting this field fails startup.
# "safe"      -- OP-Stack safe block: sequencer batch posted to L1, not yet
#                L1-finalized. Cuts hedging lag to ~seconds on Base.
#                Tradeoff: an L1 reorg dropping the batch tx could in principle
#                invalidate a safe-ingested fill (no reversal path exists; full
#                reorg handling is tracked separately in the Reorg protection
#                project). Also, when safe regresses within the quiet-skew band,
#                the checkpoint is frozen and newly-canonical fills in the
#                reorged range are not ingested (same no-reversal-path tradeoff).
# "finalized" -- L1-finalized block (Casper FFG). Full reorg protection but
#                ~20 min hedging lag on Base.
ingestion_cutoff = "safe"
# Seconds between fill-watch poll cycles on this chain (required; was the
# global order_fill_poll_interval with a hidden default of 5).
order_fill_poll_interval_secs = 5
# Exactly one watched chain is the primary: the one whose inventory the bot
# polls and rebalances automatically. Fills are hedged on every watched chain.
primary = true
# Alpaca's issuer wallet on this chain -- ERC-20 transfers for redemption go
# here. Per chain: a redemption delivers tokens that exist on one chain, so
# sending them to another chain's issuer address would burn them.
#
# Required when [rebalancing] is configured (equity redemptions), and by the
# alpaca-redeem and transfer-equity CLI commands (overridable there with
# --redemption-wallet).
redemption_wallet = "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

# Ethereum is a cash-corridor endpoint only: the bot holds USDC and signs
# there, but runs no orderbook and ingests no fills, so it has no [trading]
# table. Confirmations are deeper than Base's because an L1 reorg is a
# different risk from an OP-Stack sequencer batch.
[chains.ethereum]
# Holds and moves USDC for the corridor; it runs no orderbook, so it has
# no [trading] table.
lifecycle = "active"
required_confirmations = 12

# HyperEVM, same shape as Ethereum.
[chains.hyperevm]
# A signer exists and nothing moves yet. Raising this to "active" fails
# startup: no CCTP domain and no HYPE price source are wired.
lifecycle = "observe-only"
required_confirmations = 1

[wallet]
kind = "private-key"
address = "0xfcad0b19bb29d4674531d6f115237e16afce377c"

# For kind = "turnkey", use instead:
# [wallet]
# kind = "turnkey"
# address = "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
# organization_id = "org-example-turnkey-org-id"
#
# Turnkey authentication comes from exactly ONE of:
#   - api_private_key in the SECRETS file [wallet] section (stored key), or
#   - kms_api_key here: a GCP KMS EC_SIGN_P256_SHA256 key version whose
#     public half is registered as a Turnkey API user. Requests are then
#     stamped via the runtime's ambient GCP identity (IAM, keyless) and
#     the secrets file needs no [wallet] section at all.
# kms_api_key = "projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>/cryptoKeyVersions/1"

[bot_gas_valuation]
chainlink_feed = "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"

# Optional — the ST0xOrchestrator contracts, needed to sign MintAuthV1
# recipient authorizations for orchestrator-mode mints. Which assets are
# orchestrator-mode is owned by the issuance bot (the vault_mode field on its
# per-asset status endpoint); this section only supplies contract addresses,
# one per chain (each chain carries its own deployment; the keys are chain
# names: base, ethereum, hyperevm). Mint authorization signs against the base
# entry — every tokenized equity the bot mints lives on Base. Omit while every
# asset is vault-direct. When present, an empty map, an unknown chain key, or a
# malformed or zero address fails config validation even before any asset
# cuts over.
# [orchestrator.addresses]
# base = "0xcccccccccccccccccccccccccccccccccccccccc"

# Optional — only needed for automatic rebalancing.
# Without this section the bot runs in Standalone mode (hedging only).
[rebalancing]
# Transfer timeout in seconds before stuck inflight state is tombstoned and cleared.
# 1800 = 30 minutes.
transfer_timeout_secs = 1800
# Skip a chain's rebalancing evaluations when its inventory snapshot is
# older than this bound (or absent, e.g. right after a restart).
inventory_staleness_bound_secs = 300
# Per-attempt wall-clock bound for a single Base->Alpaca transfer job attempt.
# A hung RPC inside the transfer is aborted after this so the attempt fails and
# retries instead of wedging forever. Must exceed the worst-case single resume
# (CCTP attestation + Alpaca deposit polling); only trips on a true hang.
# 3600 = 60 minutes.
transfer_attempt_timeout_secs = 3600
# CCTP attestation polling timeouts stay retryable until this deadline.
# 86400 = 24 hours.
attestation_retry_deadline_secs = 86400
# Maximum number of consecutive revert-class CCTP burn failures that will be
# reclassified as safe redrives (scan-or-reburn path) before the circuit
# opens and the operator is alerted. Required when usdc.mode = "enabled".
# Suggested value: 5 (covers transient RPC oscillation; halts for permanent
# contract reverts such as USDC blocklist or paused TokenMessenger).
max_burn_revert_redrives = 5
# Dividend freeze guard. When "enabled", the rebalancing trigger queries
# issuance's per-asset status endpoint each equity cycle and fails closed (skips
# and alerts) when the status cannot be confirmed. When "disabled", the guard is
# not wired and equity rebalancing proceeds without consulting issuance -- an
# operator escape hatch for an issuance outage. Issuance secrets stay required
# either way, so re-enabling is a pure config change.
freeze_check = "enabled"
equity = { target = 0.5, deviation = 0.2 }
usdc = { mode = "enabled", target = 0.5, deviation = 0.3 }

[chains.base.trading.assets.equities.EXAMPLE]
tokenized_equity = "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
tokenized_equity_derivative = "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
trading = "enabled"
rebalancing = "disabled"
# Auto-recovery for wrapped equity tokens detected in bot wallets:
# resumes a stalled mint/redemption that owns the balance, or
# deposits orphaned tokens back into the Raindex vault.
wrapped_equity_recovery = "disabled"
# When enabled, counter-trades for this asset may be placed during extended
# (pre-/after-market) sessions as limit orders, instead of waiting for the
# regular open. Extended sessions have thinner liquidity and wider spreads,
# so the limit price is derived from the latest trade plus
# `[broker].counter_trade_slippage_bps`. Leave disabled to restrict hedging
# to regular-hours market orders.
# Single vault: vault_ids = "0xab12"
# Multiple vaults: vault_ids = ["0xab12", "0xcd34"]
# operational_limit = 100.0

[chains.base.trading.assets.cash]
rebalancing = "enabled"
# Single vault: vault_ids = "0xcd34"
# Multiple vaults: vault_ids = ["0xcd34", "0xef56"]
# operational_limit = 10000.0

# Optional — enables the Orders dashboard tab by querying the st0x REST API.
# When absent, the Orders tab shows "unavailable in simulate mode".
# Credentials go in the secrets file under [rest_api].
# [rest_api]
# url = "https://api.example.com"

# Required: issuance internal status API origin for the rebalancing freeze
# guard. The api_key stays in the secrets file under [issuance].
[issuance]
base_url = "http://issuance.internal:8000"

# Required in rebalancing mode — low-gas balance alerting and the thresholds
# that refuse fresh transfers before funds move. Optional only when the
# [rebalancing] section is absent. Every field is required (no silent defaults).
# Alerts are structured ERROR logs (target "operational_alert"); delivery to
# humans happens downstream via the log pipeline (Cloud Logging -> Grafana
# alert rules), so no delivery credentials are needed.
[alerts]
# Seconds between native-balance polls.
poll_interval = 300
# Minimum seconds between repeated low-balance alerts while still low; 12h
# (twice daily) keeps a persistent low balance from being noisy.
realert_interval = 43200
# Native-gas balance below which alerts fire, per chain, as decimal-ETH
# strings. Required for every chain the gas monitor runs on (base, ethereum);
# a chain the monitor does not cover is rejected rather than ignored.
[alerts.low_balance_thresholds]
base = "0.05"
ethereum = "0.05"
