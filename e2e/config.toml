server_port = 8001
board_port = 8002
log_level = "trace"
database_url = ":memory:"
apalis_finished_job_cleanup_interval_secs = 3600
inventory_divergence_threshold = 10

[pricing]
ws_url = "ws://127.0.0.1:8098/ws"
[telemetry]
service_name = "st0x-hedge-e2e"
environment = "e2e"
traces_endpoint = "http://localhost:10428"
logs_endpoint = "http://localhost:9428"

[chains.base.trading.assets.equities.EXAMPLE]
trading = "enabled"
rebalancing = "disabled"
wrapped_equity_recovery = "disabled"
tokenized_equity = "0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
tokenized_equity_derivative = "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
[assets.equities.EXAMPLE]
extended_hours_counter_trading = "disabled"


[chains.base]
required_confirmations = 0

[chains.base.trading]
orderbook = "0x1111111111111111111111111111111111111111"
inventory_mode = "legacy"
inventory_adapters = []
vault_owner = "0x3333333333333333333333333333333333333333"
deployment_block = 1
ingestion_cutoff = "safe"

# Ethereum is a cash-corridor endpoint only: the bot holds USDC and signs
# there, but runs no orderbook and ingests no fills, so it has no [trading]
# table. Confirmations are deeper than Base's because an L1 reorg is a
# different risk from an OP-Stack sequencer batch.
[chains.ethereum]
required_confirmations = 12

# HyperEVM, same shape as Ethereum.
[chains.hyperevm]
required_confirmations = 1

[rest_api]
url = "http://localhost:8099"

# ETH/USD valuation source for bot-gas cost recording (ADR 0020). Only
# required once [rebalancing] is enabled. `chainlink_feed` here is the real
# Base mainnet address -- a PLACEHOLDER with no deployed code on the local
# anvil chain the e2e harness runs against, so it is NOT usable as-is for a
# server started from this file with rebalancing on. Rebalancing e2e
# scenarios instead build their ctx programmatically and override this with
# the harness's deployed Chainlink stub address (see `build_rebalancing_ctx`
# and `build_usdc_rebalancing_ctx` in
# `tests/e2e/rebalancing/assertions.rs`). This section only exists so
# `[bot_gas_valuation]` is present and TOML-valid for tests that merely parse
# this file; do not rely on it to run rebalancing against a live server.
[bot_gas_valuation]
chainlink_feed = "0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70"
