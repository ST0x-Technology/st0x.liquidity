[package]
name = "st0x-execution"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Enable mock mode for testing from downstream crates
mock = ["test-support", "st0x-alpaca/mock"]
# Expose test-only constructors
test-support = ["st0x-alpaca/test-support"]

[dependencies]
alloy.workspace = true
async-trait.workspace = true
chrono.workspace = true
rain-math-float.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

st0x-dto = { version = "0.1.0", path = "../dto" }
st0x-finance.workspace = true
st0x-float-macro.workspace = true
st0x-float-serde.workspace = true
st0x-alpaca = { workspace = true, features = ["broker", "wallet"] }
alloy-primitives.workspace = true

[dev-dependencies]
httpmock.workspace = true
proptest.workspace = true
serde_json.workspace = true
serial_test.workspace = true
st0x-alpaca = { workspace = true, features = [
  "broker",
  "wallet",
  "mock",
  "test-support",
] }
tracing-test.workspace = true

[lints]
workspace = true
