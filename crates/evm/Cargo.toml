[package]
name = "st0x-evm"
version = "0.1.0"
edition = "2024"

[features]
default = []
mock = ["local-signer", "dep:url", "dep:anyhow"]
local-signer = []
turnkey = [
  "dep:reqwest",
  "dep:serde_json",
  "dep:turnkey_client",
  "dep:turnkey_api_key_stamper",
  "dep:mime",
  # KMS-stamped (keyless) Turnkey authentication: base64/sha2 for the
  # AsymmetricSign round-trip, p256 to parse/compress the public key and
  # verify KMS signatures before use.
  "dep:base64",
  "dep:p256",
  "dep:sha2",
]
test-support = ["dep:url"]

[dependencies]
alloy.workspace = true
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
base64 = { workspace = true, optional = true }
dashmap = "6.1.0"
futures = "0.3.32"
mime = { version = "0.3.17", optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pem"], optional = true }
sha2 = { version = "0.10", optional = true }
rain-error-decoding.workspace = true
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
turnkey_api_key_stamper = { version = "0.7.0", optional = true }
turnkey_client = { version = "0.7.0", optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
httpmock.workspace = true
rand.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-test.workspace = true

[lints]
workspace = true
