[package]
name = "st0x-tokenization"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Expose test-only constructors and helpers (MockTokenizer, setup_anvil, ...)
test-support = [
  "st0x-evm/local-signer",
  "st0x-evm/test-support",
  "st0x-alpaca/test-support",
]
# Mock tokenization HTTP API for tests and local simulation in downstream crates
mock = ["test-support", "st0x-execution/mock", "st0x-alpaca/mock"]

[dependencies]
alloy.workspace = true
async-trait.workspace = true
rain-math-float.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

st0x-evm.workspace = true
st0x-execution.workspace = true
st0x-wrapper.workspace = true
st0x-alpaca = { workspace = true, features = ["tokenization"] }

[dev-dependencies]
httpmock.workspace = true
proptest.workspace = true
serde_json = "1"
st0x-alpaca = { workspace = true, features = [
  "tokenization",
  "mock",
  "test-support",
] }
st0x-evm = { workspace = true, features = [
  "mock",
  "test-support",
  "local-signer",
] }
st0x-execution = { workspace = true, features = ["mock", "test-support"] }
st0x-float-macro.workspace = true
st0x-wrapper = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-test.workspace = true
uuid = { version = "1", features = ["serde", "v4"] }

[lints]
workspace = true
