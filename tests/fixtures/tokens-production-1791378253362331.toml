# T0's per-token config. Field names are the ones the owning service uses.
#
# Who owns what:
#   [chains.<c>]                chain_id, quote_token: pricing. contract, inventory: bebop.
#   [chains.<c>.assets...<SYM>] pricing, venues: pricing (venues = bebop / raindex / hook,
#                               only on a priced slot). vault_ids: liquidity and bebop.
#                               tokenized_equity, trading, rebalancing,
#                               wrapped_equity_recovery, operational_limit,
#                               target_share: liquidity. operational_limit also caps
#                               the symbol's hedges on every chain: the lowest one wins.
#                               tokenized_equity_derivative: everyone (the wt token).
#   [assets.equities.<SYM>]     fixed_half_spread_bps, spread_model: pricing.
#                               extended_hours_counter_trading: liquidity.
#   [[trading_state.scopes]]    pricing.
#
# Bump schema_version on any rename or type change; consumers refuse a version
# they do not know and keep their last good copy.
schema_version = 1

